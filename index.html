<section style="background: #F4F1EA; color: #1B2A4A; padding: 56px 0 64px"><div class="wrap"><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Inkassoanwalt für Deutschland und Österreich</p><h1 class="serif h1" style="margin: 0; font-size: 46px; line-height: 1.08; font-weight: 400">Inkassoanwalt für Unternehmen: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">offene Forderungen in Deutschland und Österreich durchsetzen</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Ihr Kunde zahlt nicht, trotz Rechnung und Mahnung? Als Inkassoanwalt übernehmen wir Ihre Forderung, vom ersten Anwaltsschreiben über das Mahnverfahren bis zur Zwangsvollstreckung. Unsere Besonderheit: Wir setzen Forderungen auch gegen Kunden in Österreich durch, mit einem Ansprechpartner für beide Länder.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="inkasso-online-beauftragen/" style="background: #1B2A4A; color: #FFFFFF">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid #1B2A4A; color: #1B2A4A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #5A6172">Sie erhalten eine Einschätzung zu Erfolgsaussicht, Weg und Kosten.</p><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #DDD6C8; font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Tätig in Deutschland und Österreich</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Auftrag, Unterlagen und Abstimmung vollständig digital</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungszahl und Quelle nach Freigabe]</span></span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Auszeichnungen mit Jahr und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="assets/img/jan-wasserfall.jpg" alt="Rechtsanwalt Jan Waßerfall" style="display: block; width: 100%; height: 560px; object-fit: cover; object-position: 50% 20%; border-radius: 14px"><div style="position: absolute; left: 20px; bottom: 20px; background: #FFFFFF; color: #1B2A4A; padding: 14px 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(27,42,74,0.16)"><div class="serif" style="font-size: 18px">Jan Waßerfall</div><div style="font-size: 13px; color: #5A6172; margin-top: 2px">Rechtsanwalt · Kanzlei Waßerfall</div></div></div></div></div></section><section style="background: #F4F1EA"><div class="wrap"><div class="g4" style="gap: 24px; background: #1B2A4A; color: #FFFFFF; border-radius: 12px; padding: 28px 36px">

</div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Zwei Länder, ein Mandat</p><h2 class="h2">Inkassoanwalt für Deutschland und Österreich</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ein Inkassoanwalt ist ein Rechtsanwalt, der offene Forderungen für Gläubiger einzieht, außergerichtlich und vor Gericht. Wir tun das für Unternehmen in Deutschland und Österreich.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Viele Lieferanten haben Kunden auf beiden Seiten der Grenze. Zahlt ein Kunde in Wien oder Graz nicht, brauchen Sie sonst eine deutsche Kanzlei, ein österreichisches Inkassobüro und eine österreichische Kanzlei. Bei uns bleibt es ein Mandat: Wir holen den Titel in Deutschland und beantragen die Exekution, also die Zwangsvollstreckung, in Österreich. Mehr dazu auf der Seite <a href="inkasso-oesterreich/">Inkasso Österreich</a>.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ausgangslage</p><h2 class="h2">Wann ein Inkassoanwalt hilft: typische Fälle</h2></div><p class="lead" style="margin: 0">Ein Inkassoanwalt lohnt sich, sobald Ihr Kunde nach Fälligkeit und Mahnung nicht zahlt oder nicht mehr reagiert.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ein Geschäftskunde zahlt seit Wochen nicht und reagiert nicht auf Ihre Mahnungen.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Kunde behauptet Mängel, um die Zahlung hinauszuzögern.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Sie haben schon einen Vollstreckungsbescheid oder ein Urteil, aber kein Geld gesehen.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ihr Kunde sitzt in Österreich, und Sie wissen nicht, welches Gericht zuständig ist.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Die Forderung droht zum Jahresende zu verjähren.</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Leistungen</p><h2 class="h2">Leistungen des Inkassoanwalts im Überblick</h2></div><p class="lead" style="margin: 0">Wir übernehmen den ganzen Weg von der Prüfung bis zum Geld auf Ihrem Konto. Wählen Sie die Leistung, die zu Ihrer Lage passt.</p></div><div class="g3" style="margin: 10px 0 18px"><a class="card" href="inkasso-unternehmen/" style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 170px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(27,42,74,0.04)"><span class="serif" style="font-size: 21px; line-height: 1.25; color: #1B2A4A">Inkasso für Unternehmen</span><span style="font-size: 15px; line-height: 1.55; color: #333D4F">Firmenkunde zahlt eine Rechnung nicht</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Mehr erfahren <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="inkasso-oesterreich/" style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 170px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(27,42,74,0.04)"><span class="serif" style="font-size: 21px; line-height: 1.25; color: #1B2A4A">Inkasso Österreich</span><span style="font-size: 15px; line-height: 1.55; color: #333D4F">Ihr Kunde sitzt in Österreich</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Mehr erfahren <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="mahnverfahren-anwalt/" style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 170px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(27,42,74,0.04)"><span class="serif" style="font-size: 21px; line-height: 1.25; color: #1B2A4A">Gerichtliches Mahnverfahren</span><span style="font-size: 15px; line-height: 1.55; color: #333D4F">Sie brauchen schnell einen Titel</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Mehr erfahren <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="zwangsvollstreckung-glaeubiger/" style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 170px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(27,42,74,0.04)"><span class="serif" style="font-size: 21px; line-height: 1.25; color: #1B2A4A">Zwangsvollstreckung</span><span style="font-size: 15px; line-height: 1.55; color: #333D4F">Sie haben einen Titel, aber kein Geld</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Mehr erfahren <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="inkasso-berlin/" style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 170px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(27,42,74,0.04)"><span class="serif" style="font-size: 21px; line-height: 1.25; color: #1B2A4A">Inkasso Berlin</span><span style="font-size: 15px; line-height: 1.55; color: #333D4F">Sie möchten einen persönlichen Termin in Berlin</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Mehr erfahren <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="leistungen/" style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 170px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(27,42,74,0.04)"><span class="serif" style="font-size: 21px; line-height: 1.25; color: #1B2A4A">Alle Leistungen</span><span style="font-size: 15px; line-height: 1.55; color: #333D4F">Übersicht aller Leistungen und Branchen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Mehr erfahren <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ablauf</p><h2 class="h2">Ablauf: so arbeitet Ihr Inkassoanwalt</h2></div><p class="lead" style="margin: 0">Sie geben die Forderung einmal ab. Alles Weitere läuft digital, ohne Termin in der Kanzlei.</p></div><div style="position: relative; margin: 24px 0 20px"><div style="position: absolute; left: 22px; right: 22px; top: 21px; height: 2px; border-radius: 2px; background: #E6E1D6" aria-hidden="true"></div><ol style="list-style: none; margin: 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px" class="g5"><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">1</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Anfrage</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Sie laden Rechnung, Mahnungen und Vertrag im Formular hoch.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">2</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Ersteinschätzung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Wir prüfen Forderung und Schuldner, etwa im Handelsregister und auf laufende Insolvenzverfahren. Sie erhalten eine Einschätzung zu Erfolgsaussicht, Weg und Kosten. <span class="ph">[Reaktionszeit]</span></p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">3</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Anwaltsschreiben</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Ihr Kunde erhält eine Zahlungsaufforderung mit Frist. Zahlt er, ist die Sache ohne Gericht erledigt.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">4</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Titel</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Zahlt er nicht, beantragen wir einen Mahnbescheid oder erheben Klage.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">5</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Vollstreckung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Mit dem Titel lassen wir pfänden, in Deutschland oder in Österreich. Zahlungen leiten wir an Sie weiter.</p></li></ol></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px"><div class="serif" style="font-size: 26px; line-height: 1.25">Forderung prüfen lassen</div><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #D2D7E1">Ihre Forderung in wenigen Minuten einreichen.** Sie brauchen: Rechnung, Vertrag oder Auftragsbestätigung, Mahnungen und Schriftverkehr.</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><a class="btn" href="inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> Anrufen</a></div></div></div></section><section style="padding: 0 0 88px; background: #FFFFFF"><div class="wrap" style="padding-top: 72px"><img src="assets/img/besprechung.jpg" alt="Besprechung von Rechnungen und Vertrag am Schreibtisch" style="display: block; width: 100%; height: 340px; object-fit: cover; object-position: 60% 50%; border-radius: 14px"></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Kosten</p><h2 class="h2">Was kostet ein Inkassoanwalt?</h2></div><p class="lead" style="margin: 0">Ist Ihr Kunde in Verzug, muss er die notwendigen Anwaltskosten in der Regel als Verzugsschaden ersetzen (§§ 280, 286 BGB). Vorstrecken müssen Sie vor allem Gerichtskosten.</p></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Die Anwaltsgebühren richten sich nach dem Rechtsanwaltsvergütungsgesetz (RVG) und steigen mit der Höhe der Forderung. Gegenüber Unternehmen stehen Ihnen zusätzlich Verzugszinsen von 9 Prozentpunkten über dem Basiszinssatz und eine Pauschale von 40 € zu (§ 288 Abs. 2 und 5 BGB).</p><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Forderung</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Anwaltsschreiben</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Mahnverfahren bis Titel</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Wer trägt es am Ende?</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Forderung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">500 €</td><td data-label="Anwaltsschreiben" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Mahnverfahren bis Titel" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr><tr style="vertical-align: top"><td data-label="Forderung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">2.000 €</td><td data-label="Anwaltsschreiben" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Mahnverfahren bis Titel" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr><tr style="vertical-align: top"><td data-label="Forderung" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">10.000 €</td><td data-label="Anwaltsschreiben" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Mahnverfahren bis Titel" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr></tbody></table></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160"><span class="ph">[Stand und Berechnungsgrundlage (RVG, GKG) nach Freigabe durch Jan]</span></p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Ein Risiko bleibt: Ist beim Schuldner nichts zu holen, bleiben die Kosten bei Ihnen. Deshalb prüfen wir den Schuldner vorab und nennen Ihnen vor jedem Schritt die Kosten. Mehr auf der Seite <a href="kosten/">Kosten</a>.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Dauer</p><h2 class="h2">Wie lange dauert Anwaltsinkasso?</h2></div><p class="lead" style="margin: 0">Zahlt Ihr Kunde auf das Anwaltsschreiben, ist die Sache oft nach wenigen Wochen erledigt. Mit Mahnverfahren und Vollstreckung sollten Sie mit mehreren Monaten rechnen.</p></div><div style="position: relative; margin: 30px 0 20px"><div class="tlbar" style="position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 4px; background: #F4F1EA" aria-hidden="true"></div><div class="g4 tlg" style="position: relative; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 24px"><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Zahlungsfrist im Anwaltsschreiben</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3"><span class="ph">[in der Regel 14 Tage]</span></p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Widerspruchsfrist gegen den Mahnbescheid</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">2 Wochen ab Zustellung (§ 692 Abs. 1 Nr. 3 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Einspruchsfrist gegen den Vollstreckungsbescheid</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">2 Wochen ab Zustellung (§§ 339, 700 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #B8945A; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Zwangsvollstreckung</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3"><span class="ph">[Dauer nach Erfahrung]</span></p></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Verjährung</p><h2 class="h2">Verjährung: warum Sie nicht zu lange warten sollten</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Forderungen verjähren in Deutschland in der Regel nach drei Jahren, gerechnet ab dem Ende des Jahres, in dem sie entstanden sind (§§ 195, 199 BGB). Eine Rechnung aus dem Jahr 2023 verjährt also mit Ablauf des 31.12.2026.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Eine Mahnung hält die Verjährung nicht auf. Das tun erst Verhandlungen oder ein gerichtliches Verfahren, etwa ein Mahnbescheid (§§ 203, 204 BGB). Mehr dazu: <a href="wann-verjaehren-rechnungen-forderungen/">Wann verjähren Rechnungen und Forderungen?</a></p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ihr Vorteil</p><h2 class="h2">Inkassoanwalt oder Inkassobüro?</h2></div><p class="lead" style="margin: 0">Der Unterschied zeigt sich, wenn Ihr Kunde die Forderung bestreitet: Im streitigen Gerichtsverfahren darf Sie ein Inkassobüro nicht vertreten (§ 79 Abs. 2 ZPO), ein Anwalt schon.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Frage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Inkassoanwalt</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Inkassobüro</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Anwaltsschreiben und Mahnverfahren</td><td data-label="Inkassoanwalt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td><td data-label="Inkassobüro" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Vertretung vor Gericht, wenn der Kunde bestreitet</td><td data-label="Inkassoanwalt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td><td data-label="Inkassobüro" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #9B2C2C; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9B2C2C" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg> nein</span></td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Zwangsvollstreckung in bewegliches Vermögen (Konto, Lohn, Sachen)</td><td data-label="Inkassoanwalt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td><td data-label="Inkassobüro" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Zwangsvollstreckung in Grundstücke</td><td data-label="Inkassoanwalt" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td><td data-label="Inkassobüro" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #9B2C2C; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9B2C2C" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg> nein</span></td></tr></tbody></table></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ausführlich: <a href="#">Anwalt oder Inkassobüro?</a></p></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Praxis</p><h2 class="h2">Beispiele aus der Praxis</h2></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Konstruierte Beispiele zur Erläuterung, keine Mandatsfälle.</p><div class="g2" style="gap: 20px; margin: 10px 0 18px"><article style="padding: 30px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Handwerksbetrieb, 6.500 € offen</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Ein Elektrobetrieb aus Potsdam wartet seit vier Monaten auf seinen Werklohn. Der Kunde reagiert nicht. Nach dem Anwaltsschreiben verstreicht die Frist. Wir beantragen einen Mahnbescheid, der Kunde widerspricht nicht. Mit dem Vollstreckungsbescheid beauftragen wir den Gerichtsvollzieher.</p></article><article style="padding: 30px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Lieferant, Kunde in Graz, 14.000 € offen</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Ein Großhändler aus Bayern liefert an eine GmbH in Graz. Wir prüfen Firmenbuch und Ediktsdatei, holen in Deutschland einen Titel und beantragen die Exekution auf das Geschäftskonto in Österreich. Der Großhändler hat in beiden Ländern einen Ansprechpartner.</p></article></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Ratgeber für Gläubiger</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="wann-verjaehren-rechnungen-forderungen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Wann verjähren Rechnungen und Forderungen?</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="ratgeber/mahnung-muster/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Mahnung Muster: 1. Mahnung, 2. Mahnung, letzte Mahnung</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span clas
