<p style="margin: 14px 0 0">In der Regel arbeiten wir dabei mit einer österreichischen Kooperationskanzlei zusammen. <span class="ph">[Name der Kooperationskanzlei, falls gewünscht]</span> Für Sie bleibt es ein Mandat mit einem Ansprechpartner. Besprechungen sind in Berlin, in Kirchbach (Steiermark) oder per Video möglich.</p>

<p class="eb">Kosten</p>
<h2 class="h2">Kosten: was Inkasso in Österreich kostet und wer sie trägt</h2>
<p class="lead" style="margin: 22px 0 0">Ist Ihr Kunde in Verzug, muss er die notwendigen Kosten der Rechtsverfolgung in der Regel ersetzen. Vorstrecken müssen Sie vor allem die Gerichtsgebühren.</p>
<p style="margin: 14px 0 0; font-size: 16px; line-height: 1.7; color: #333D4F">Zwischen Unternehmern stehen Ihnen außerdem Verzugszinsen und eine Pauschale von 40 € zu. Nach deutschem Recht folgt das aus § 288 BGB, nach österreichischem Recht aus §§ 456 und 458 UGB. Welche Vorschrift gilt, hängt vom Recht ab, das auf Ihren Vertrag anwendbar ist.</p>
<p style="margin: 18px 0 0; padding: 18px 22px; background: #FFFFFF; border-radius: 10px; font-size: 15px; line-height: 1.65; color: #333D4F"><strong>Ein Risiko bleibt:</strong> Ist beim Schuldner nichts zu holen, bleiben die Kosten bei Ihnen. Deshalb prüfen wir den Schuldner vorab und sagen Ihnen vor jedem Schritt, was er kostet. Abgerechnet wird nach RVG oder nach Vereinbarung. Mehr dazu auf der Seite <a href="../kosten/">Kosten</a>.</p>
</div>
<div style="border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07); padding: 32px; align-self: start">

<section class="sec" style="padding: 96px 0; background: #F4F1EA">
<div class="wrap">
<img src="../assets/img/justizgebaeude.jpg" alt="Treppenhalle eines historischen Justizgebäudes" style="display: block; width: 100%; height: 300px; object-fit: cover; object-position: 50% 58%; border-radius: 12px">
<div class="g2" style="margin-top: 32px; gap: 24px">

<p class="eb">Fristen</p>
<h2 class="h2" style="font-size: 32px">Fristen: wann Ihre Forderung verjährt</h2>
<p style="margin: 18px 0 0; font-size: 17px; line-height: 1.65; font-weight: 500">Warten kostet Geld: Nach drei Jahren kann sich Ihr Kunde in der Regel auf Verjährung berufen.</p>
<p style="margin: 14px 0 0; font-size: 15px; line-height: 1.7; color: #333D4F">Welche Frist gilt, hängt davon ab, welches Recht auf Ihren Vertrag anwendbar ist. Nach deutschem Recht verjähren Forderungen in drei Jahren, gerechnet ab dem Ende des Jahres, in dem sie entstanden sind (§§ 195, 199 BGB). Nach österreichischem Recht verjähren Forderungen aus Lieferungen und Leistungen eines Unternehmens ebenfalls in drei Jahren, aber ab Fälligkeit (§ 1486 ABGB).</p>
<p style="margin: 14px 0 0; font-size: 15px; line-height: 1.7; color: #333D4F">Eine Mahnung allein hält die Verjährung nicht auf. Das tun erst Verhandlungen oder ein gerichtliches Verfahren, etwa ein Mahnbescheid (§§ 203, 204 BGB). Mehr dazu: <a href="../wann-verjaehren-rechnungen-forderungen/">Wann verjähren Rechnungen und Forderungen?</a></p>
</div>
<div style="border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07); padding: 40px">
<p class="eb">Insolvenz</p>
<h2 class="h2" style="font-size: 32px">Ihr Kunde in Österreich ist insolvent?</h2>
<p style="margin: 18px 0 0; font-size: 17px; line-height: 1.65; font-weight: 500">Dann melden wir Ihre Forderung im Insolvenzverfahren an. Ohne Anmeldung erhalten Sie aus der Insolvenzmasse nichts.</p>
<p style="margin: 14px 0 0; font-size: 15px; line-height: 1.7; color: #333D4F">Insolvenzverfahren werden in Österreich in der Ediktsdatei der Justiz veröffentlicht. Dort steht auch die Frist für die Anmeldung. Wir prüfen außerdem, ob Sie Sicherheiten haben, etwa einen Eigentumsvorbehalt. Dann können Sie Ihre Ware unter Umständen herausverlangen, statt nur eine Quote zu erhalten.</p>
</div>
</div>
</div>
</section>

<!-- WARUM ANWALT -->
<section class="sec" style="padding: 96px 0; background: #FFFFFF">
<div class="wrap">
<p class="eb">Ihr Vorteil</p>
<h2 class="h2">Warum ein Anwalt statt eines Inkassobüros?</h2>
<div class="g2" style="gap: 20px; margin-top: 40px">
<div style="display: flex; gap: 18px; padding: 28px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><h3 class="serif" style="margin: 0; font-size: 21px; font-weight: 400">Ein Ansprechpartner für beide Länder</h3><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Kein Wechsel zwischen deutscher Kanzlei, österreichischem Inkassobüro und österreichischer Kanzlei.</p></div></div>
<div style="display: flex; gap: 18px; padding: 28px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><h3 class="serif" style="margin: 0; font-size: 21px; font-weight: 400">Auch bei Streit</h3><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Bestreitet Ihr Kunde die Forderung, geht es vor Gericht weiter, ohne dass Sie den Dienstleister wechseln. Im streitigen Gerichtsverfahren dürfen Inkassobüros Sie nicht vertreten.</p></div></div>
<div style="display: flex; gap: 18px; padding: 28px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><h3 class="serif" style="margin: 0; font-size: 21px; font-weight: 400">Bis zur Exekution</h3><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Wir führen das Verfahren bis zur Zwangsvollstreckung, in Deutschland und in Österreich.</p></div></div>
<div style="display: flex; gap: 18px; padding: 28px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><h3 class="serif" style="margin: 0; font-size: 21px; font-weight: 400">Rechtliche Prüfung vor dem ersten Schritt</h3><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Wir prüfen Einwände Ihres Kunden, etwa eine Mängelrüge oder eine Aufrechnung, bevor Kosten entstehen.</p></div></div>
</div>
</div>
</section>

<!-- PRAXISBEISPIEL -->

<p class="eb">Beispiel aus der Praxis</p>
<h2 class="h2">Ersatzteile nach Linz geliefert, Rechnung offen</h2>
<div class="g2" style="gap: 40px; margin-top: 36px; align-items: stretch">
<div style="position: relative">
<img src="../assets/img/lager.jpg" alt="Lager mit Ersatzteilen eines Maschinenbauers" style="display: block; width: 100%; height: 100%; min-height: 380px; object-fit: cover; object-position: 30% 50%; border-radius: 12px">
</div>
<div style="border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07); padding: 32px">
<div class="g3" style="gap: 16px; padding-bottom: 20px; border-bottom: 1px solid #ECE7DC">
<div><div style="font-size: 13px; font-weight: 600; color: #8B6A2E">Forderung</div><div class="serif" style="font-size: 22px; margin-top: 6px">18.000 €</div></div>
<div><div style="font-size: 13px; font-weight: 600; color: #8B6A2E">Schuldner</div><div class="serif" style="font-size: 22px; margin-top: 6px">GmbH in Linz</div></div>
<div><div style="font-size: 13px; font-weight: 600; color: #8B6A2E">Weg</div><div class="serif" style="font-size: 18px; line-height: 1.35; margin-top: 6px">Mahnbescheid, Exekution in Österreich</div></div>
</div>
<p style="margin: 14px 0 0; font-size: 12px; color: #5A6172">Konstruiertes Beispiel zur Erläuterung, kein Mandatsfall.</p>
<div style="margin-top: 14px; font-size: 15px; line-height: 1.65; color: #333D4F">
<p style="margin: 0">Ein Maschinenbauer aus Rosenheim liefert Ersatzteile für 18.000 € an eine GmbH in Linz. Die Rechnung bleibt trotz zwei Mahnungen offen.</p>
<p style="margin: 12px 0 0">Wir prüfen zuerst das Firmenbuch und die Ediktsdatei: Die GmbH ist aktiv, ein Insolvenzverfahren läuft nicht. Auf unsere Zahlungsaufforderung reagiert der Kunde nicht.</p>
<p style="margin: 12px 0 0">Weil die Ware ab Werk in Rosenheim geliefert wurde, sind deutsche Gerichte zuständig. Wir beantragen einen Mahnbescheid, der Kunde widerspricht nicht. Mit dem Vollstreckungsbescheid beantragen wir in Österreich die Exekution auf das Geschäftskonto der GmbH.</p>
</div>
<p class="serif" style="margin: 18px 0 0; padding-top: 16px; border-top: 1px solid #ECE7DC; font-size: 19px">Der Maschinenbauer hat im ganzen Verfahren einen Ansprechpartner.</p>
