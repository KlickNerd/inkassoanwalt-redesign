<section style="background: #F4F1EA; color: #1B2A4A; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #5A6172; margin-bottom: 32px"><a href="../" style="color: #5A6172">Startseite</a> / <a href="../leistungen/" style="color: #5A6172">Leistungen</a> / <span>Inkasso Transport und Logistik</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Inkasso für Transport und Logistik</p><h1 class="serif h1" style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 400">Inkasso für Spedition, Transport und Logistik: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">offene Frachtforderungen durchsetzen</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Ihr Auftraggeber zahlt die Fracht nicht oder rechnet mit einem angeblichen Transportschaden auf? Wir treiben offene Frachtforderungen für Frachtführer, Speditionen und Logistikunternehmen ein. Dabei nutzen wir, was das Frachtrecht Ihnen gibt: das Pfandrecht am Gut und kurze Fristen, die auch Ihren Kunden binden.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #1B2A4A; color: #FFFFFF">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid #1B2A4A; color: #1B2A4A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #DDD6C8; font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Mitgliedschaft Arbeitsgemeinschaft Transportrecht im DAV bestätigen]</span></span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Tätig in Deutschland und Österreich</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungszahl und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="../assets/img/lager.jpg" alt="Lager mit Regalen und verpackter Ware" style="display: block; width: 100%; height: 500px; object-fit: cover; object-position: 30% 50%; border-radius: 14px"></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ausgangslage</p><h2 class="h2">Frachtrechnung nicht bezahlt: typische Fälle</h2></div><p class="lead" style="margin: 0">Diese Seite ist für Transportunternehmen, deren Auftraggeber Fracht oder Speditionsvergütung nicht zahlt.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Auftraggeber kürzt die Fracht wegen eines Schadens, der bei Ablieferung nicht gerügt wurde.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Mehrere Frachtrechnungen eines Stammkunden sind offen, er zahlt immer später.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Auftraggeber sitzt in Österreich oder einem anderen EU-Staat.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Standgeld oder Wartezeiten werden nicht bezahlt.</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Leistungen</p><h2 class="h2">Frachteninkasso: was wir übernehmen</h2></div><p class="lead" style="margin: 0">Wir übernehmen den ganzen Weg von der Prüfung bis zur Vollstreckung.</p></div><div class="g2" style="gap: 16px; margin: 8px 0 18px"><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Prüfung von Forderung und Auftraggeber</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Frachtbrief, Ablieferquittung, Schriftverkehr, Handelsregister und Insolvenzbekanntmachungen.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Prüfung der Einwände</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Schadensanzeige rechtzeitig? Haftung begrenzt? ADSp wirksam vereinbart?</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Pfandrecht</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Wir sagen Ihnen, ob Sie Ware zurückhalten dürfen und wie Sie sie verwerten.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Durchsetzung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Anwaltsschreiben, Mahnverfahren, Klage, Zwangsvollstreckung, in Deutschland und Österreich.</p></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Pfandrecht</p><h2 class="h2">Pfandrecht von Frachtführer und Spediteur nutzen</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Solange Sie das Gut besitzen, haben Sie ein gesetzliches Pfandrecht daran: als Frachtführer nach § 440 HGB, als Spediteur nach § 464 HGB.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Es sichert alle Forderungen aus dem laufenden Auftrag und auch unbestrittene Forderungen aus früheren Aufträgen desselben Auftraggebers. Nach der Ablieferung besteht es nur fort, wenn Sie es innerhalb von zehn Tagen gerichtlich geltend machen und das Gut noch beim Empfänger ist.</p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #F4F1EA; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Deshalb zählt der Anruf vor der Ablieferung.</span></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Einwände</p><h2 class="h2">Einwände des Auftraggebers: Schaden, Aufrechnung, ADSp</h2></div><p class="lead" style="margin: 0">Ein behaupteter Schaden befreit Ihren Kunden nicht ohne Weiteres von der Fracht.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 360px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Einwand</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was das Frachtrecht dazu sagt</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Einwand" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">„Die Ware war beschädigt.“</td><td data-label="Was das Frachtrecht dazu sagt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ohne rechtzeitige Schadensanzeige wird vermutet, dass das Gut unbeschädigt abgeliefert wurde (§ 438 HGB, Art. 30 CMR).</td></tr><tr style="vertical-align: top"><td data-label="Einwand" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">„Wir rechnen mit unserem Schaden auf.“</td><td data-label="Was das Frachtrecht dazu sagt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Die Haftung ist meist auf 8,33 Sonderziehungsrechte je Kilogramm begrenzt (§ 431 HGB, Art. 23 CMR). Die Gegenforderung ist oft kleiner als behauptet.</td></tr><tr style="vertical-align: top"><td data-label="Einwand" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; line-height: 1.6">Aufrechnung trotz ADSp</td><td data-label="Was das Frachtrecht dazu sagt" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Sind die ADSp 2017 vereinbart, ist eine Aufrechnung nur mit fälligen und unbestrittenen Gegenansprüchen zulässig (Ziffer 19 ADSp). <span class="ph">[Prüfvermerk Jan]</span></td></tr></tbody></table></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Verjährung</p><h2 class="h2">Verjährung von Frachtforderungen: nur ein Jahr</h2></div><p class="lead" style="margin: 0">Frachtforderungen verjähren in der Regel schon nach einem Jahr, nicht nach drei Jahren wie gewöhnliche Rechnungen.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Transport</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Frist</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Beginn</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Transport" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Innerdeutsch (HGB), auch Spedition</td><td data-label="Frist" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">1 Jahr (§ 439 HGB, § 463 HGB)</td><td data-label="Beginn" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Mit der Ablieferung des Guts</td></tr><tr style="vertical-align: top"><td data-label="Transport" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">International auf der Straße (CMR)</td><td data-label="Frist" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">1 Jahr (Art. 32 CMR)</td><td data-label="Beginn" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Drei Monate nach Abschluss des Beförderungsvertrags</td></tr></tbody></table></div><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #F4F1EA; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Eine Mahnung hält die Verjährung nicht auf. Das tun erst Verhandlungen oder ein gerichtliches Verfahren (§§ 203, 204 BGB). Wer bis zum Jahresende wartet, verliert die Forderung womöglich schon.</span></div></div></section><section style="padding: 0 0 88px; background: #FFFFFF"><div class="wrap" style="padding-top: 72px"><img src="../assets/img/graz.jpg" alt="Altstadt von Graz mit Uhrturm" style="display: block; width: 100%; height: 340px; object-fit: cover; object-position: 65% 55%; border-radius: 14px"></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">International</p><h2 class="h2">Grenzüberschreitende Frachtforderungen</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Bei CMR-Transporten können Sie auch am Ort der Übernahme oder Ablieferung des Guts klagen (Art. 31 CMR), oft also in Deutschland. Den Titel vollstrecken wir in Österreich selbst, siehe <a href="../inkasso-oesterreich/">Inkasso Österreich</a>. Für andere EU-Staaten: <a href="../inkasso-eu-ausland/">Forderungen im EU-Ausland</a>.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ablauf und Kosten</p><h2 class="h2">Ablauf und Kosten im Frachteninkasso</h2></div><p class="lead" style="margin: 0">Sie laden Frachtbrief, Rechnung und Ablieferquittung hoch, wir melden uns mit einer Einschätzung. <span class="ph">[Reaktionszeit]</span></p></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ist Ihr Auftraggeber in Verzug, muss er die Anwaltskosten in der Regel ersetzen, dazu Verzugszinsen und 40 € Pauschale (§§ 286, 288 BGB). Vorstrecken müssen Sie vor allem Gerichtskosten. Ist nichts zu holen, bleiben die Kosten bei Ihnen. <span class="ph">[Kostenbeispiel und Stand nach Freigabe]</span> Mehr: <a href="../kosten/">Kosten</a>.</p><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px"><div class="serif" style="font-size: 26px; line-height: 1.25">Forderung prüfen lassen</div><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #D2D7E1">Frachtforderung einreichen.** Sie brauchen: Frachtbrief oder Auftrag, Rechnung, Ablieferquittung, Schriftverkehr.</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> Anrufen</a></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Insolvenz</p><h2 class="h2">Auftraggeber insolvent?</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Dann melden wir Ihre Forderung beim Insolvenzverwalter an (§ 174 InsO). Halten Sie noch Ware, kann Ihr Pfandrecht ein Recht auf abgesonderte Befriedigung geben (§ 50 InsO).</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Praxis</p><h2 class="h2">Beispiel: Spedition aus Passau, Auftraggeber in Linz</h2></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Konstruiertes Beispiel, kein Mandatsfall.</p><div class="g2" style="gap: 20px; margin: 10px 0 18px"><article style="padding: 30px; border-radius: 10px; background: #F4F1EA; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Ausgangslage</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Eine Spedition fährt für einen Großhändler in Linz. Drei Frachtrechnungen über 7.400 € sind offen, der Kunde kündigt eine Aufrechnung wegen eines Nässeschadens an. Eine Schadensanzeige gab es bei Ablieferung nicht.</p></article><article style="padding: 30px; border-radius: 10px; background: #F4F1EA; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Vorgehen</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Da der Transport in Passau begann, klagen wir dort. Mit dem Urteil beantragen wir die Exekution in Österreich.</p></article></div></div></section><section class="sec" style="padding: 96px 0; background: #1B2A4A; color: #FFFFFF"><div class="wrap side"><div><p class="eb" style="color: #E0B252">Ansprechpartner</p><h2 class="h2" style="color: #FFFFFF">Ihr Ansprechpartner für Transportrecht</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Ihr Ansprechpartner ist Rechtsanwalt Jan Waßerfall. <span class="ph">[Erfahrung im Transport- und Speditionsrecht und Mitgliedschaft Arbeitsgemeinschaft Transportrecht: Angaben von Jan]</span></p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Thema</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../wann-verjaehren-rechnungen-forderungen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Wann verjähren Rechnungen und Forderungen?</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/einwaende-des-kunden/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Einwände des Kunden: Mängel und Aufrechnung</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/exekution-oesterreich/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Exekution in Österreich</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../inkasso-unternehmen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso für Unternehmen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../inkasso-oesterreich/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso Österreich</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../inkasso-eu-ausland/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Forderungen im EU-Ausland</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA">
