<div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span>Durch das Absenden entsteht noch kein Mandat</div>

<div>
<p class="eb" style="color: #E0B252">Mandantenportal</p>
<h2 class="serif" style="margin: 0; font-size: 34px; line-height: 1.2; font-weight: 400">Auftrag direkt im Mandantenportal erteilen</h2>
<p style="margin: 16px 0 0; font-size: 16px; line-height: 1.7; color: #D2D7E1">Sie wissen schon, dass Sie uns beauftragen möchten? Dann erteilen Sie den Auftrag direkt im Mandantenportal.</p>
<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: #D2D7E1">Dort laden Sie Unterlagen hoch, erteilen die Vollmacht und sehen den Stand Ihres Verfahrens. So läuft das Mandat vollständig digital, auch gegen Kunden in <a href="../inkasso-oesterreich/" style="color: #E0B252">Österreich</a>.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
<a class="btn" href="https://portal-wasserfall.de/inkasso" style="background: #FFFFFF; color: #1B2A4A">Zum Mandantenportal <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #D2D7E1">
<span style="display: flex; gap: 10px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E0B252" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> Unterlagen hochladen</span>
<span style="display: flex; gap: 10px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E0B252" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> Vollmacht digital erteilen</span>
<span style="display: flex; gap: 10px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E0B252" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> Stand jederzeit einsehen</span>

<section class="sec" style="padding: 96px 0; background: #FFFFFF">

<span style="width: 48px; height: 48px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; color: #8B6A2E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
<h2 class="serif" style="margin: 20px 0 0; font-size: 26px; font-weight: 400">Datenschutz bei der Online-Beauftragung</h2>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #333D4F">Ihre Angaben und Unterlagen gehen nur an die Kanzlei und dienen der Prüfung Ihrer Forderung.</p>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #333D4F">Als Rechtsanwalt ist Jan Waßerfall zur Verschwiegenheit verpflichtet (§ 43a Abs. 2 BRAO). Das gilt auch für Daten Ihres Kunden. Die Übertragung ist verschlüsselt. <span class="ph">[Speicherort und Dienstleister bestätigen]</span> Einzelheiten in der <a href="../datenschutz/">Datenschutzerklärung</a>.</p>
