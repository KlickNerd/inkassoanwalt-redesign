<section style="background: #F4F1EA; color: #1B2A4A; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #5A6172; margin-bottom: 32px"><a href="../" style="color: #5A6172">Startseite</a> / <a href="../leistungen/" style="color: #5A6172">Leistungen</a> / <span>Inkasso Berlin</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Inkasso Berlin</p><h1 class="serif h1" style="margin: 0; font-size: 48px; line-height: 1.08; font-weight: 400">Inkasso Berlin: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">Ihr Rechtsanwalt für Forderungseinzug am Kaiserdamm</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Sie haben Ihren Sitz in Berlin und ein Kunde zahlt nicht? Wir ziehen Ihre Forderung als Rechtsanwälte ein, vom ersten Schreiben über das Mahnverfahren bis zur Zwangsvollstreckung. Die Kanzlei sitzt am Kaiserdamm 100 in Charlottenburg. Sie können persönlich vorbeikommen, müssen es aber nicht.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #1B2A4A; color: #FFFFFF">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid #1B2A4A; color: #1B2A4A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #5A6172">Termin in der Kanzlei nach Vereinbarung.</p><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #DDD6C8; font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Kanzlei am Kaiserdamm 100, 14057 Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungen im Google-Unternehmensprofil: Zahl und Stand nach Freigabe]</span></span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Auszeichnungen mit Jahr und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="../assets/img/berlin.jpg" alt="Straße in Berlin-Charlottenburg" style="display: block; width: 100%; height: 540px; object-fit: cover; object-position: 50% 55%; border-radius: 14px"><div style="position: absolute; left: 20px; bottom: 20px; background: #FFFFFF; color: #1B2A4A; padding: 14px 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(27,42,74,0.16)"><div class="serif" style="font-size: 18px">Kanzlei Waßerfall</div><div style="font-size: 13px; color: #5A6172; margin-top: 2px">Kaiserdamm 100, 14057 Berlin</div></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #1B2A4A; color: #FFFFFF"><div class="wrap side"><div><p class="eb" style="color: #E0B252">Anwaltsinkasso</p><h2 class="h2" style="color: #FFFFFF">Inkasso in Berlin durch einen Rechtsanwalt</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Inkasso durch einen Anwalt heißt: Ein Rechtsanwalt fordert Ihren Kunden zur Zahlung auf und führt, wenn nötig, auch das Gerichtsverfahren und die Vollstreckung. Sie wechseln nicht den Dienstleister, wenn Ihr Kunde widerspricht.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Ein Inkassobüro darf Sie im streitigen Gerichtsverfahren nicht vertreten (§ 79 Abs. 2 ZPO). Bestreitet Ihr Kunde die Rechnung, braucht es dann ohnehin einen Anwalt. Mehr dazu: <a href="#">Anwalt oder Inkassobüro?</a></p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ausgangslage</p><h2 class="h2">Typische Fälle Berliner Unternehmen</h2></div><p class="lead" style="margin: 0">Wir arbeiten für Berliner Unternehmen und Selbstständige, deren Kunden in Berlin, im übrigen Deutschland oder in Österreich sitzen.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #FFFFFF; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ein Handwerksbetrieb wartet auf seinen Werklohn, der Kunde rügt plötzlich Mängel.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #FFFFFF; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Eine Agentur hat geliefert, der Auftraggeber reagiert auf keine Mahnung mehr.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #FFFFFF; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ein Großhändler hat einen Vollstreckungsbescheid, aber das Konto des Kunden ist unbekannt.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #FFFFFF; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ein Berliner Lieferant hat einen Kunden in Österreich, der nicht zahlt.</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Leistungen</p><h2 class="h2">Forderungseinzug in Berlin: unsere Leistungen</h2></div><p class="lead" style="margin: 0">Wir übernehmen den ganzen Weg, von der Prüfung bis zur Auszahlung an Sie.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Leistung</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was wir tun</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Mehr dazu</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Leistung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Prüfung</td><td data-label="Was wir tun" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Forderung und Kunde prüfen, etwa Handelsregister und Insolvenzbekanntmachungen</td><td data-label="Mehr dazu" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ablauf unten</td></tr><tr style="vertical-align: top"><td data-label="Leistung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Anwaltsschreiben</td><td data-label="Was wir tun" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Zahlungsaufforderung mit Frist</td><td data-label="Mehr dazu" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><a href="../inkasso-unternehmen/">Inkasso für Unternehmen</a></td></tr><tr style="vertical-align: top"><td data-label="Leistung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Mahnverfahren</td><td data-label="Was wir tun" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Mahnbescheid und Vollstreckungsbescheid</td><td data-label="Mehr dazu" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><a href="../mahnverfahren-anwalt/">Mahnverfahren</a></td></tr><tr style="vertical-align: top"><td data-label="Leistung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Zwangsvollstreckung</td><td data-label="Was wir tun" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Gerichtsvollzieher, Konto- und Lohnpfändung</td><td data-label="Mehr dazu" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><a href="../zwangsvollstreckung-glaeubiger/">Zwangsvollstreckung</a></td></tr><tr style="vertical-align: top"><td data-label="Leistung" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Österreich</td><td data-label="Was wir tun" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Titel holen und Exekution in Österreich beantragen</td><td data-label="Mehr dazu" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><a href="../inkasso-oesterreich/">Inkasso Österreich</a></td></tr></tbody></table></div></div></section><section style="padding: 0 0 0; background: #FFFFFF"><div class="wrap" style="padding-top: 72px"><img src="../assets/img/justizgebaeude.jpg" alt="Treppenhalle eines historischen Justizgebäudes" style="display: block; width: 100%; height: 340px; object-fit: cover; object-position: 50% 60%; border-radius: 14px"></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Gerichte in Berlin</p><h2 class="h2">Berliner Gerichte im Inkasso: Mahngericht Wedding und Gerichtsvollzieher</h2></div><p class="lead" style="margin: 0">Für Gläubiger mit Sitz in Berlin ist das Amtsgericht Wedding das zentrale Mahngericht. Dort beantragen wir Ihren Mahnbescheid, egal wo Ihr Kunde wohnt (§ 689 Abs. 2 ZPO).</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Schritt</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Zuständig</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was Sie wissen sollten</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Schritt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Mahnbescheid</td><td data-label="Zuständig" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Amtsgericht Wedding (zentrales Mahngericht für Berlin und Brandenburg)</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Maßgeblich ist Ihr Sitz als Gläubiger, nicht der Sitz Ihres Kunden.</td></tr><tr style="vertical-align: top"><td data-label="Schritt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Klage nach Widerspruch</td><td data-label="Zuständig" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Gericht am Sitz Ihres Kunden oder vereinbarter Gerichtsstand</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Sitzt Ihr Kunde in Berlin, ist es ein Berliner Amts- oder Landgericht.</td></tr><tr style="vertical-align: top"><td data-label="Schritt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Gerichtsvollzieher</td><td data-label="Zuständig" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Gerichtsvollzieher für den Wohnsitz oder Sitz Ihres Kunden</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Vermittelt über die Verteilerstelle des örtlichen Amtsgerichts.</td></tr><tr style="vertical-align: top"><td data-label="Schritt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Konto- und Lohnpfändung</td><td data-label="Zuständig" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Amtsgericht am Wohnsitz Ihres Kunden als Vollstreckungsgericht (§ 828 ZPO)</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Sitzt Ihr Kunde außerhalb Berlins, beantragen wir dort, ohne dass Sie reisen.</td></tr><tr style="vertical-align: top"><td data-label="Schritt" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Handelsregister, Insolvenz</td><td data-label="Zuständig" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[Amtsgericht Charlottenburg für Berliner Firmen, bestätigen]</span></td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Hier sehen wir vorab, ob Ihr Kunde noch besteht oder insolvent ist.</td></tr></tbody></table></div><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Weil wir in Berlin sitzen, kennen wir die Abläufe dieser Gerichte. Für Ihren Fall ist der Kanzleisitz aber nicht entscheidend: Alle Anträge gehen elektronisch an jedes Gericht in Deutschland.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Zusammenarbeit</p><h2 class="h2">Termin in der Kanzlei oder digital</h2></div><p class="lead" style="margin: 0">Sie entscheiden, wie wir zusammenarbeiten. Das Mandat kann vollständig digital laufen, ein persönlicher Termin in der Kanzlei ist nach Vereinbarung möglich.</p></div><div class="g2" style="gap: 16px; margin: 8px 0 18px"><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Vor Ort</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Kaiserdamm 100, 14057 Berlin. <span class="ph">[Anfahrt: U-Bahn, Parken, Barrierefreiheit bestätigen]</span></p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Telefon</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">+49 (0)30 62 93 06 66</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Digital</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Unterlagen im Formular hochladen, Stand im <a href="https://portal-wasserfall.de">Mandantenportal</a> verfolgen.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Google</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F"><span class="ph">[Link zum Google-Unternehmensprofil mit Bewertungen]</span></p></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ablauf</p><h2 class="h2">Ablauf: Inkasso mit Ihrem Berliner Anwalt</h2></div><p class="lead" style="margin: 0">Sie geben die Forderung einmal ab. Wir melden uns mit einer Einschätzung zu Erfolgsaussicht, Weg und Kosten.</p></div><div style="position: relative; margin: 24px 0 20px"><div style="position: absolute; left: 22px; right: 22px; top: 21px; height: 2px; border-radius: 2px; background: #E6E1D6" aria-hidden="true"></div><ol style="list-style: none; margin: 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px" class="g5"><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">1</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Anfrage</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Rechnung, Mahnungen und Vertrag im Formular hochladen oder in die Kanzlei mitbringen.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">2</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Ersteinschätzung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Wir prüfen Forderung und Kunden. <span class="ph">[Reaktionszeit]</span></p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">3</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Anwaltsschreiben</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Zahlt Ihr Kunde danach, ist die Sache ohne Gericht erledigt.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">4</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Titel</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Sonst beantragen wir den Mahnbescheid beim Amtsgericht Wedding oder erheben Klage.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">5</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Vollstreckung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Mit dem Titel lassen wir pfänden und leiten Zahlungen an Sie weiter.</p></li></ol></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">

<div style="display: flex; flex-wrap: wrap; gap: 10px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> Anrufen</a></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Kosten und Fristen</p><h2 class="h2">Kosten und Verjährung</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ist Ihr Kunde in Verzug, muss er die notwendigen Anwaltskosten in der Regel ersetzen (§§ 280, 286 BGB). Abgerechnet wird nach RVG oder nach Vereinbarung.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ist beim Kunden nichts zu holen, bleiben die Kosten bei Ihnen. Deshalb nennen wir sie vor jedem Schritt. Details auf der Seite <a href="../kosten/">Kosten</a>. Warten Sie nicht zu lange: Forderungen verjähren in der Regel nach drei Jahren ab Jahresende (§§ 195, 199 BGB), eine Mahnung hält das nicht auf. Mehr dazu: <a href="../wann-verjaehren-rechnungen-forderungen/">Wann verjähren Rechnungen und Forderungen?</a></p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Thema</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../ratgeber/kunde-zahlt-nicht/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Kunde zahlt nicht: was Unternehmer jetzt tun</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/mahnung-muster/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Mahnung Muster: 1. Mahnung, 2. Mahnung, letzte Mahnung</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Anwalt oder Inkassobüro?</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Vollstreckungsbescheid: was Gläubiger danach tun</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #F4F1EA; padding: 34px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; border: 1px solid #E6E1D6">
