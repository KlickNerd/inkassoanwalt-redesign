<section style="background: #F4F1EA; color: #1B2A4A; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #5A6172; margin-bottom: 32px"><a href="../" style="color: #5A6172">Startseite</a> / <a href="../leistungen/" style="color: #5A6172">Leistungen</a> / <span>Inkasso für Unternehmen</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Inkasso für Unternehmen</p><h1 class="serif h1" style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 400">Inkasso für Unternehmen: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">Forderungen beim Anwalt beauftragen, von der Mahnung bis zur Vollstreckung</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Ihr Geschäftskunde zahlt nicht, trotz Rechnung und Mahnung? Dann können Sie Inkasso direkt beim Anwalt beauftragen. Wir übernehmen Ihre Forderung vom ersten Anwaltsschreiben über Mahnverfahren oder Klage bis zur Zwangsvollstreckung. Auch wenn Ihr Kunde Mängel einwendet, bleibt es bei einem Ansprechpartner.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #1B2A4A; color: #FFFFFF">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid #1B2A4A; color: #1B2A4A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #5A6172">Sie erhalten eine Einschätzung zu Erfolgsaussicht, Weg und Kosten.</p><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #DDD6C8; font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Auftrag, Unterlagen und Abstimmung vollständig digital</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Auch gegen Kunden in Österreich</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungszahl und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="../assets/img/besprechung.jpg" alt="Besprechung von Rechnungen und Vertrag am Schreibtisch" style="display: block; width: 100%; height: 500px; object-fit: cover; object-position: 55% 50%; border-radius: 14px"></div></div></div></section><section class="sec" style="padding: 96px 0; background: #1B2A4A; color: #FFFFFF"><div class="wrap side"><div><p class="eb" style="color: #E0B252">Anwaltliches Inkasso</p><h2 class="h2" style="color: #FFFFFF">Inkasso für Unternehmen: auch wenn Ihr Kunde widerspricht</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Anwaltliches Inkasso heißt: Ein Rechtsanwalt zieht Ihre Forderung ein und darf Sie in jedem Verfahren vertreten, auch wenn Ihr Kunde Mängel rügt oder dem Mahnbescheid widerspricht. Dann geht es ohne Wechsel vor Gericht weiter.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ausgangslage</p><h2 class="h2">Wann Sie Inkasso beauftragen sollten: typische Fälle</h2></div><p class="lead" style="margin: 0">Inkasso lohnt sich, sobald Ihr Kunde in Verzug ist und auf Ihre Mahnung nicht zahlt oder nicht mehr reagiert.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #FFFFFF; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ein Geschäftskunde zahlt seit Wochen nicht und reagiert weder auf Anrufe noch auf Mahnungen.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #FFFFFF; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Kunde behauptet nach Wochen Mängel, um die Zahlung hinauszuzögern.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #FFFFFF; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Kunde zahlt nur Teilbeträge oder kürzt die Rechnung eigenmächtig.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #FFFFFF; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Die Forderung stammt aus dem Jahr 2023 und verjährt mit Ablauf des 31.12.2026.</span></li></ul><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Ihr Kunde ist in Verzug, wenn er nach Fälligkeit auf eine Mahnung nicht zahlt. Gegenüber Unternehmen tritt Verzug spätestens 30 Tage nach Fälligkeit und Zugang der Rechnung auch ohne Mahnung ein (§ 286 Abs. 1 und 3 BGB). Ab Verzug muss Ihr Kunde die Kosten des Inkassos in der Regel ersetzen.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Leistungen</p><h2 class="h2">Was wir beim Inkasso für Ihr Unternehmen übernehmen</h2></div><p class="lead" style="margin: 0">Wir übernehmen den ganzen Weg, von der Prüfung bis zum Geld auf Ihrem Konto.</p></div><div class="g2" style="gap: 16px; margin: 8px 0 18px"><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Prüfung von Forderung und Schuldner</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Vertrag, Rechnung und Schriftverkehr, dazu Handelsregister, Insolvenzbekanntmachungen und, wo sinnvoll, eine Wirtschaftsauskunft. So wissen Sie vorab, ob sich das Verfahren lohnt.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Anwaltliche Zahlungsaufforderung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Ein Schreiben mit Frist. Zahlt Ihr Kunde danach, ist die Sache ohne Gericht erledigt.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Mahnverfahren oder Klage</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Zahlt Ihr Kunde nicht, holen wir einen vollstreckbaren Titel: per Mahnbescheid oder, wenn er bestreitet, per Klage.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Zwangsvollstreckung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Mit dem Titel lassen wir Konten, Forderungen und Sachen pfänden und beantragen die Vermögensauskunft.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Forderungsanmeldung bei Insolvenz</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Ist Ihr Kunde insolvent, melden wir Ihre Forderung beim Insolvenzverwalter an und prüfen Ihre Sicherheiten.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Laufende Information</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Sie sehen den Stand im Mandantenportal.</p></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Entscheidungshilfe</p><h2 class="h2">Welcher Weg passt zu Ihrer Forderung?</h2></div><p class="lead" style="margin: 0">Das hängt vor allem davon ab, ob Ihr Kunde die Forderung bestreitet und ob Sie schon einen Titel haben. Wir wählen den Weg, der am wenigsten Zeit und Kosten bis zum vollstreckbaren Titel braucht.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Ihre Lage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Passender Weg</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was Sie wissen sollten</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde schweigt, die Forderung ist unbestritten</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Anwaltsschreiben, danach gerichtliches Mahnverfahren</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Rein schriftlich. Widerspricht Ihr Kunde nicht, erhalten Sie einen Vollstreckungsbescheid (§§ 688, 699 ZPO).</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde bestreitet oder rügt Mängel</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Klage, oft ohne vorheriges Mahnverfahren</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ein Widerspruch würde das Mahnverfahren ohnehin ins streitige Verfahren überleiten (§ 696 ZPO). Direkt zu klagen spart dann Zeit.</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde bietet Raten an</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ratenzahlungsvereinbarung mit Schuldanerkenntnis</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ein Anerkenntnis lässt die Verjährung neu beginnen (§ 212 BGB).</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Sie haben schon einen Titel</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Zwangsvollstreckung</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ansprüche aus einem Titel verjähren erst nach 30 Jahren (§ 197 Abs. 1 Nr. 3 und 4 BGB). Mehr auf der Seite <a href="../zwangsvollstreckung-glaeubiger/">Zwangsvollstreckung</a>.</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde sitzt in Österreich</td><td data-label="Passender Weg" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Titel in Deutschland, Exekution in Österreich</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Ein Ansprechpartner für beide Länder. Mehr auf der Seite <a href="../inkasso-oesterreich/">Inkasso Österreich</a>.</td></tr></tbody></table></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ablauf</p><h2 class="h2">Ablauf: so beauftragen Sie Inkasso beim Anwalt</h2></div><p class="lead" style="margin: 0">Sie geben die Forderung einmal ab. Alles Weitere läuft digital, ohne Termin in der Kanzlei.</p></div><div style="position: relative; margin: 24px 0 20px"><div style="position: absolute; left: 22px; right: 22px; top: 21px; height: 2px; border-radius: 2px; background: #E6E1D6" aria-hidden="true"></div><ol style="list-style: none; margin: 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px" class="g5"><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">1</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Anfrage</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Sie laden Rechnung, Mahnungen und Vertrag im Formular hoch. Das dauert wenige Minuten.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">2</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Ersteinschätzung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Wir prüfen Forderung und Schuldner. Sie erhalten eine Einschätzung zu Erfolgsaussicht, passendem Weg und Kosten. <span class="ph">[Reaktionszeit]</span></p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">3</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Auftrag</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Sie erteilen die Vollmacht digital.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">4</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Durchsetzung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Wir übernehmen Anwaltsschreiben, Mahnverfahren oder Klage und die Zwangsvollstreckung. Vor jedem Schritt, der Kosten auslöst, stimmen wir uns mit Ihnen ab.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">5</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Auszahlung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Zahlungen Ihres Kunden leiten wir an Sie weiter.</p></li></ol></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px"><div class="serif" style="font-size: 26px; line-height: 1.25">Forderung prüfen lassen</div><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #D2D7E1">Ihre Forderung in wenigen Minuten einreichen.** Sie brauchen: Rechnung, Vertrag oder Auftragsbestätigung, Liefer- oder Leistungsnachweis, Mahnungen und Schriftverkehr.</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> Anrufen</a></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Kosten</p><h2 class="h2">Was kostet Inkasso für Unternehmen und wer zahlt es?</h2></div><p class="lead" style="margin: 0">Ist Ihr Kunde in Verzug, muss er die notwendigen Kosten des Inkassos in der Regel als Verzugsschaden ersetzen (§§ 280 Abs. 1 und 2, 286 BGB). Vorstrecken müssen Sie vor allem die Gerichtskosten.</p></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Die Anwaltsgebühren richten sich nach dem RVG und der Höhe der Forderung. Gegenüber Unternehmen stehen Ihnen zusätzlich Verzugszinsen von 9 Prozentpunkten über dem Basiszinssatz und eine Pauschale von 40 € zu (§ 288 Abs. 2 und 5 BGB). Die Pauschale wird auf die Kosten der Rechtsverfolgung angerechnet. Die Zinsen berechnet der <a href="https://www.wasserfall.com/verzugszinsrechner/">Verzugszinsrechner</a>.</p><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Posten</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Betrag bei 10.000 €</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Wer trägt es am Ende?</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Ersteinschätzung</td><td data-label="Betrag bei 10.000 €" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[kostenlos oder Pauschale]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Sie</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Anwaltliche Zahlungsaufforderung</td><td data-label="Betrag bei 10.000 €" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Gerichtskosten für das Mahnverfahren</td><td data-label="Betrag bei 10.000 €" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach GKG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Zunächst Sie, dann Ihr Kunde</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Anwaltskosten im Mahnverfahren</td><td data-label="Betrag bei 10.000 €" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Zunächst Sie, dann Ihr Kunde</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Zwangsvollstreckung (Gerichtsvollzieher, Anwalt)</td><td data-label="Betrag bei 10.000 €" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Zunächst Sie, dann Ihr Kunde (§ 788 ZPO)</td></tr></tbody></table></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160"><span class="ph">[Stand und Berechnungsgrundlage (RVG, GKG, GvKostG) nach Freigabe durch Jan]</span></p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Ein Risiko bleibt: Ist beim Schuldner nichts zu holen, bleiben die Kosten bei Ihnen. Verlieren Sie einen Prozess, tragen Sie auch die Kosten der Gegenseite (§ 91 ZPO). Deshalb prüfen wir Forderung und Schuldner vorab und nennen Ihnen vor jedem Schritt die Kosten. Beispiele für 500, 2.000 und 10.000 € auf der Seite <a href="../kosten/">Kosten</a>.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Dauer</p><h2 class="h2">Wie lange dauert Inkasso beim Anwalt?</h2></div><p class="lead" style="margin: 0">Zahlt Ihr Kunde auf das Anwaltsschreiben, ist die Sache oft nach wenigen Wochen erledigt. Mit Mahnverfahren und Vollstreckung sollten Sie mit mehreren Monaten rechnen, mit einer Klage auch länger.</p></div><div style="position: relative; margin: 30px 0 20px"><div class="tlbar" style="position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 4px; background: #F4F1EA" aria-hidden="true"></div><div class="g5 tlg" style="position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px"><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Zahlungsfrist im Anwaltsschreiben</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3"><span class="ph">[in der Regel 14 Tage]</span></p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Widerspruch gegen den Mahnbescheid</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">2 Wochen ab Zustellung (§ 692 Abs. 1 Nr. 3 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Einspruch gegen den Vollstreckungsbescheid</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">2 Wochen ab Zustellung (§§ 339, 700 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Klage, wenn der Kunde bestreitet</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">mehrere Monate bis zum Urteil, je nach Gericht</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #B8945A; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Zwangsvollstreckung</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3"><span class="ph">[Dauer nach Erfahrung]</span></p></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Verjährung</p><h2 class="h2">Verjährung: warum Sie mit dem Inkasso nicht warten sollten</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Forderungen verjähren in Deutschland in der Regel nach drei Jahren, gerechnet ab dem Ende des Jahres, in dem sie entstanden sind (§§ 195, 199 BGB). Eine Rechnung aus dem Jahr 2023 verjährt also mit Ablauf des 31.12.2026.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Eine Mahnung hält die Verjährung nicht auf. Das tun erst Verhandlungen, ein Mahnbescheid oder eine Klage (§§ 203, 204 Abs. 1 Nr. 1 und 3 BGB). Mehr dazu: <a href="../wann-verjaehren-rechnungen-forderungen/">Wann verjähren Rechnungen und Forderungen?</a></p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Insolvenz</p><h2 class="h2">Kunde insolvent: Forderung im Insolvenzverfahren anmelden</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Dann melden wir Ihre Forderung beim Insolvenzverwalter an. Ohne Anmeldung erhalten Sie aus der Insolvenzmasse nichts.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Die Frist für die Anmeldung steht im Eröffnungsbeschluss (§§ 28, 174 InsO). Haben Sie unter Eigentumsvorbehalt geliefert, können Sie Ihre Ware unter Umständen herausverlangen, statt nur eine Quote zu erhalten (§ 47 InsO). Wir prüfen das mit der Anmeldung. Mehr dazu: <a href="#">Forderung in der Insolvenz anmelden</a></p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Einwände</p><h2 class="h2">Bestrittene Forderung: was tun bei Mängeleinwand?</h2></div><p class="lead" style="margin: 0">Ein Einwand Ihres Kunden stoppt nicht Ihre Forderung, sondern nur das vereinfachte Verfahren. Ob der Einwand trägt, prüfen wir, bevor weitere Kosten entstehen.</p></div><div class="g2" style="gap: 16px; margin: 8px 0 18px"><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Mängelrüge beim Handelskauf</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Unter Kaufleuten muss der Kunde Ware unverzüglich untersuchen und Mängel unverzüglich rügen. Rügt er zu spät, gilt die Ware als genehmigt (§ 377 HGB).</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Werkleistung ohne Abnahme</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Bei Werkverträgen wird der Werklohn grundsätzlich mit der Abnahme fällig (§§ 640, 641 BGB). Wir prüfen, ob eine Abnahme vorliegt oder als erklärt gilt.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Echter Mangel</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Dann darf der Kunde einen Teil des Preises zurückhalten (§§ 320, 641 Abs. 3 BGB). Den Rest verlangen wir trotzdem.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Aufrechnung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Bei einer behaupteten Gegenforderung prüfen wir, ob sie besteht und fällig ist (§ 387 BGB).</p></div></div></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Mehr dazu: <a href="#">Einwände des Kunden richtig einordnen</a></p></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ihr Vorteil</p><h2 class="h2">Inkasso beim Anwalt oder beim Inkassobüro?</h2></div><p class="lead" style="margin: 0">Der Unterschied zeigt sich, wenn Ihr Kunde die Forderung bestreitet: Im streitigen Gerichtsverfahren darf Sie ein Inkassobüro nicht vertreten, ein Anwalt schon (§ 79 Abs. 2 ZPO).</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Frage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Anwalt</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Inkassobüro</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Zahlungsaufforderung und gerichtliches Mahnverfahren</td><td data-label="Anwalt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td><td data-label="Inkassobüro" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Vertretung vor Gericht, wenn der Kunde widerspricht oder bestreitet</td><td data-label="Anwalt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td><td data-label="Inkassobüro" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #9B2C2C; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9B2C2C" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg> nein</span></td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Zwangsvollstreckung in bewegliches Vermögen (Konto, Lohn, Sachen)</td><td data-label="Anwalt" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td><td data-label="Inkassobüro" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Zwangsvollstreckung in Grundstücke</td><td data-label="Anwalt" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #1E6B45; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> ja</span></td><td data-label="Inkassobüro" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span style="display: inline-flex; align-items: center; gap: 6px; color: #9B2C2C; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9B2C2C" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg> nein</span></td></tr></tbody></table></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Wechseln Sie mitten im Verfahren vom Inkassobüro zum Anwalt, muss Ihr Kunde die doppelten Kosten unter Umständen nicht vollständig ersetzen. Ausführlich: <a href="#">Anwalt oder Inkassobüro?</a></p></div></section><section style="padding: 0 0 88px; background: #FFFFFF"><div class="wrap" style="padding-top: 72px"><img src="../assets/img/lager.jpg" alt="Lager mit Ersatzteilen eines Großhändlers" style="display: block; width: 100%; height: 340px; object-fit: cover; object-position: 30% 50%; border-radius: 14px"></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Praxis</p><h2 class="h2">Beispiel aus der Praxis: Großhändler, Kunde rügt Mängel nach acht Wochen</h2></div><div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Konstruiertes Beispiel zur Erläuterung, kein Mandatsfall.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ein Großhändler für Gastronomiebedarf aus Leipzig liefert Küchengeräte für 7.800 € an eine Restaurant GmbH in Hamburg. Die Rechnung bleibt trotz Mahnung offen. Die GmbH ist aktiv, nicht insolvent und reagiert auch auf unsere Zahlungsaufforderung nicht. Wir beantragen einen Mahnbescheid. Jetzt widerspricht die GmbH und rügt erstmals Mängel an einer Spülmaschine, acht Wochen nach der Lieferung.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Wir führen das Verfahren als Klage weiter und legen Lieferschein und den Zeitpunkt der ersten Rüge vor, denn unter Kaufleuten muss ein Mangel unverzüglich gerügt werden. Wie das Verfahren ausgeht, entscheidet das Gericht. Der Großhändler hat von der ersten Mahnung bis zum Urteil einen Ansprechpartner.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Thema</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../ratgeber/kunde-zahlt-nicht/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Kunde zahlt nicht: was Unternehmer jetzt tun können</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Rechte bei Zahlungsverzug: Zinsen, Pauschale, Kosten</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Klagen oder nicht? Das Kostenrisiko einschätzen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Ratenzahlungsvereinbarung mit säumigen Kunden</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../mahnverfahren-anwalt/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Gerichtliches Mahnverfahren</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../zwangsvollstreckung-glaeubiger/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Zwangsvollstreckung</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../inkasso-oesterreich/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso Österreich</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #F4F1EA; padding: 34px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; border: 1px solid #E6E1D6">

    var faqRaw = [{"q": "Was kostet die Ersteinschätzung?", "a": "[Antwort nach Freigabe durch Jan]"}, {"q": "Wer zahlt die Kosten des Inkassos?", "a": "In der Regel Ihr Kunde, wenn er in Verzug ist. Die Kosten sind dann ein Verzugsschaden (§§ 280, 286 BGB). Ist beim Kunden nichts zu holen, tragen Sie die Kosten selbst. Details auf der Seite Kosten."}, {"q": "Ab welcher Forderungshöhe lohnt sich Inkasso beim Anwalt?", "a": "Eine feste Untergrenze gibt es nicht. Entscheidend sind Höhe der Forderung, Zahlungsfähigkeit des Kunden und ob er bestreitet. Das klären wir in der Ersteinschätzung, bevor Kosten entstehen."}, {"q": "Wann kann ich Inkasso beauftragen?", "a": "Sobald die Rechnung fällig ist und Ihr Kunde nicht zahlt. Damit er die Kosten ersetzen muss, sollte er in Verzug sein: nach einer Mahnung oder, bei Unternehmen, spätestens 30 Tage nach Fälligkeit und Zugang der Rechnung (§ 286 BGB)."}, {"q": "Was passiert, wenn mein Kunde die Forderung bestreitet?", "a": "Dann geht es vor Gericht weiter, ohne dass Sie den Dienstleister wechseln. Wir prüfen den Einwand vorher und sagen Ihnen, wie wir ihn einschätzen. Mehr dazu: Einwände des Kunden."}, {"q": "Wie lange dauert es, bis ich mein Geld bekomme?", "a": "Zahlt der Kunde auf das Anwaltsschreiben, oft wenige Wochen. Mit Mahnverfahren und Vollstreckung mehrere Monate, mit einer Klage auch länger."}, {"q": "Muss ich in die Kanzlei kommen?", "a": "Nein. Unterlagen, Vollmacht und Abstimmung laufen digital. Ein Termin in Berlin ist möglich, aber nicht nötig. Gerichtstermine nehmen wir für Sie wahr."}, {"q": "Wann verjährt meine Forderung?", "a": "In der Regel nach drei Jahren, gerechnet ab dem Ende des Jahres, in dem sie entstanden ist (§§ 195, 199 BGB). Eine Mahnung allein hält die Verjährung nicht auf, ein Mahnbescheid schon."}, {"q": "Was passiert, wenn mein Kunde insolvent ist?", "a": "Dann melden wir Ihre Forderung beim Insolvenzverwalter an und prüfen, ob Sie Sicherheiten wie einen Eigentumsvorbehalt haben."}];
