<section style="background: #F4F1EA; color: #1B2A4A; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #5A6172; margin-bottom: 32px"><a href="../" style="color: #5A6172">Startseite</a> / <span>Kooperation</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Kooperation</p><h1 class="serif h1" style="margin: 0; font-size: 42px; line-height: 1.08; font-weight: 400">Kooperation für Steuerberater, Buchhaltungen und Hausverwaltungen: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">offene Forderungen weiterleiten</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F"><span class="ph">[Offene Entscheidung 10: Ist diese Seite gewünscht? Bis zur Entscheidung nicht veröffentlichen.]</span></p><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Sie sehen in der Buchhaltung Ihrer Mandanten, welche Rechnungen seit Monaten offen sind. Die Durchsetzung, notfalls vor Gericht, übernehmen wir. Diese Seite zeigt, wie Sie einen Fall an uns weitergeben.</p></div><div style="position: relative"><img src="../assets/img/besprechung.jpg" alt="Besprechung von Rechnungen und Vertrag am Schreibtisch" style="display: block; width: 100%; height: 420px; object-fit: cover; object-position: 60% 50%; border-radius: 14px"></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Zielgruppe</p><h2 class="h2">Für wen die Kooperation gedacht ist</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Für Steuerberater, Buchhaltungsbüros und Hausverwaltungen, deren Mandanten oder Eigentümer offene Forderungen haben.</p><div class="g2" style="gap: 16px; margin: 8px 0 18px"><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Steuerberater und Buchhaltungen</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Ihr Mandant hat überfällige Kundenrechnungen oder muss Forderungen abschreiben.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Hausverwaltungen</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Ein Mieter oder ehemaliger Mieter schuldet Miete, oder Eigentümer zahlen ihr Hausgeld nicht.</p></div></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ablauf</p><h2 class="h2">So leiten Sie offene Forderungen weiter</h2></div><p class="lead" style="margin: 0">Am einfachsten meldet sich Ihr Mandant selbst bei uns, mit Ihrem Hinweis im Rücken.</p></div><ol style="list-style: none; margin: 10px 0 18px; padding: 0"><li style="display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 18px; padding-bottom: 24px; position: relative"><span style="position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: #E6E1D6" aria-hidden="true"></span><span class="serif" style="position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 17px">1</span><div style="padding-top: 7px"><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #333D4F">Sie sprechen Ihren Mandanten auf die offenen Posten an und geben ihm den Link zu dieser Seite oder zur <a href="../inkasso-online-beauftragen/">Online-Beauftragung</a>.</p></div></li><li style="display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 18px; padding-bottom: 24px; position: relative"><span style="position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: #E6E1D6" aria-hidden="true"></span><span class="serif" style="position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 17px">2</span><div style="padding-top: 7px"><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #333D4F">Ihr Mandant reicht die Forderung selbst ein oder bittet Sie, das mit seinem Einverständnis zu tun.</p></div></li><li style="display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 18px; padding-bottom: 24px; position: relative"><span style="position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: #E6E1D6" aria-hidden="true"></span><span class="serif" style="position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 17px">3</span><div style="padding-top: 7px"><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #333D4F">Wir prüfen Forderung und Schuldner und melden uns beim Mandanten mit einer Einschätzung zu Weg und Kosten.</p></div></li><li style="display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 18px; padding-bottom: 0; position: relative"><span class="serif" style="position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 17px">4</span><div style="padding-top: 7px"><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #333D4F">Erteilt der Mandant den Auftrag, übernehmen wir alles Weitere bis zur Vollstreckung.</p></div></li></ol><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Geben Sie Daten Ihres Mandanten nur mit seinem Einverständnis an uns weiter. Für Sie gelten eigene Verschwiegenheitspflichten.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Unterlagen</p><h2 class="h2">Was Ihr Mandant für das Inkasso braucht</h2></div><p class="lead" style="margin: 0">Mit diesen Unterlagen können wir die Forderung ohne Rückfragen einschätzen.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Rechnung, Vertrag oder Auftragsbestätigung, bei Mieten den Mietvertrag</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Offene-Posten-Liste oder Mieterkonto</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Mahnungen und Schriftverkehr mit dem Schuldner</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Aktuelle Anschrift des Schuldners</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Rollen</p><h2 class="h2">Rollen: wer ist unser Mandant?</h2></div><p class="lead" style="margin: 0">Unser Mandant ist der Gläubiger, also Ihr Mandant oder der Eigentümer. Mit ihm kommt der Vertrag zustande, er erhält die Abrechnung.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 360px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Frage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Antwort</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Wer beauftragt uns?</td><td data-label="Antwort" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Der Gläubiger selbst. Bei einer Wohnungseigentümergemeinschaft klären wir vorab, wer sie vertritt. <span class="ph">[Mit Jan klären: Auftrag über die Verwaltung]</span></td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Wer zahlt die Anwaltskosten?</td><td data-label="Antwort" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Der Gläubiger. Ist der Schuldner in Verzug, muss er sie in der Regel ersetzen (§§ 280, 286 BGB).</td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Erfahren Sie, wie es läuft?</td><td data-label="Antwort" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Nur, wenn Ihr Mandant zustimmt. Wir sind zur Verschwiegenheit verpflichtet (§ 43a Abs. 2 BRAO).</td></tr><tr style="vertical-align: top"><td data-label="Frage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; line-height: 1.6">Erhalten Sie eine Provision?</td><td data-label="Antwort" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Nein. Für die Vermittlung von Mandaten dürfen wir nichts zahlen oder gewähren (§ 49b Abs. 3 BRAO).</td></tr></tbody></table></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Weiterführend</p><h2 class="h2">Mehr für Ihre Mandanten</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../inkasso-unternehmen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso für Unternehmen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../inkasso-vermieter/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso für Vermieter</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction:
