<section style="background: #F4F1EA; color: #1B2A4A; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #5A6172; margin-bottom: 32px"><a href="../" style="color: #5A6172">Startseite</a> / <a href="../leistungen/" style="color: #5A6172">Leistungen</a> / <span>Inkasso Deutschland</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Für Gläubiger aus Österreich</p><h1 class="serif h1" style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 400">Inkasso Deutschland: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">Forderung gegen deutsche Kunden eintreiben, für Gläubiger aus Österreich</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Ihr Kunde in Deutschland zahlt nicht? Wir treiben Ihre Forderung dort ein, vom Anwaltsschreiben bis zur Zwangsvollstreckung, und erklären jeden Schritt mit den Begriffen, die Sie aus Österreich kennen.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #1B2A4A; color: #FFFFFF">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid #1B2A4A; color: #1B2A4A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #5A6172">Sie erhalten eine Einschätzung zu Erfolgsaussicht, Weg und Kosten.</p><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #DDD6C8; font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt in Deutschland seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Österreichische Titel sind in Deutschland ohne Anerkennungsverfahren vollstreckbar</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungszahl und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="../assets/img/berlin.jpg" alt="Straße in Berlin-Charlottenburg" style="display: block; width: 100%; height: 520px; object-fit: cover; object-position: 50% 55%; border-radius: 14px"></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ausgangslage</p><h2 class="h2">Schuldner in Deutschland: typische Fälle</h2></div><p class="lead" style="margin: 0">Diese Seite ist für Unternehmen aus Österreich, deren Kunde in Deutschland eine Rechnung nicht bezahlt.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ein Kunde in München oder Hamburg reagiert nicht mehr auf Ihre Mahnungen.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Sie haben einen österreichischen Zahlungsbefehl oder ein Urteil, das Vermögen liegt in Deutschland.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Sie wissen nicht, welches deutsche Gericht zuständig ist.</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Leistungen</p><h2 class="h2">Forderung in Deutschland eintreiben: was wir übernehmen</h2></div><p class="lead" style="margin: 0">Wir übernehmen den ganzen Weg in Deutschland, von der Prüfung bis zur Pfändung.</p></div><div class="g2" style="gap: 16px; margin: 8px 0 18px"><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Prüfung von Forderung und Schuldner</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Handelsregister, Insolvenzbekanntmachungen, wo sinnvoll Wirtschaftsauskunft. So wissen Sie vorab, ob es sich lohnt.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Anwaltliche Zahlungsaufforderung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">mit Frist.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Titel</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Mahnbescheid, Europäischer Zahlungsbefehl oder Klage.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Zwangsvollstreckung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Gerichtsvollzieher und Kontopfändung.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #FFFFFF"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Forderungsanmeldung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">bei Insolvenz.</p></div></div></div></div></section><section style="padding: 0 0 88px; background: #FFFFFF"><div class="wrap" style="padding-top: 72px"><img src="../assets/img/graz.jpg" alt="Altstadt von Graz mit Uhrturm" style="display: block; width: 100%; height: 340px; object-fit: cover; object-position: 65% 55%; border-radius: 14px"></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Begriffe</p><h2 class="h2">Deutsche Verfahren mit österreichischen Begriffen erklärt</h2></div><p class="lead" style="margin: 0">Die meisten Schritte gibt es in beiden Ländern, sie heißen nur anders.</p></div><div class="g3" style="gap: 16px; margin: 10px 0 18px"><div style="padding: 24px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px"><div class="mbridge" style="display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 8px; align-items: center"><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Österreich</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Exekution</div></div><span style="width: 28px; height: 28px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Deutschland</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Zwangsvollstreckung</div></div></div><p style="margin: 0; padding-top: 12px; border-top: 1px solid #E6E1D6; font-size: 14px; line-height: 1.6; color: #333D4F">Pfändung von Konto, Lohn, Sachen oder Grundstücken mit einem Titel.</p></div><div style="padding: 24px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px"><div class="mbridge" style="display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 8px; align-items: center"><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Österreich</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Zahlungsbefehl (Mahnverfahren)</div></div><span style="width: 28px; height: 28px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Deutschland</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Mahnbescheid, danach Vollstreckungsbescheid</div></div></div><p style="margin: 0; padding-top: 12px; border-top: 1px solid #E6E1D6; font-size: 14px; line-height: 1.6; color: #333D4F">In Deutschland zwei Stufen: Erst nach dem Vollstreckungsbescheid können Sie vollstrecken (§§ 692, 699 ZPO).</p></div><div style="padding: 24px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px"><div class="mbridge" style="display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 8px; align-items: center"><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Österreich</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Gerichtsvollzieher</div></div><span style="width: 28px; height: 28px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Deutschland</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Gerichtsvollzieher</div></div></div><p style="margin: 0; padding-top: 12px; border-top: 1px solid #E6E1D6; font-size: 14px; line-height: 1.6; color: #333D4F">Sie beauftragen ihn direkt. Er pfändet Sachen und nimmt die Vermögensauskunft ab (§ 802c ZPO).</p></div><div style="padding: 24px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px"><div class="mbridge" style="display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 8px; align-items: center"><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Österreich</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Forderungsexekution</div></div><span style="width: 28px; height: 28px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Deutschland</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Pfändungs- und Überweisungsbeschluss</div></div></div><p style="margin: 0; padding-top: 12px; border-top: 1px solid #E6E1D6; font-size: 14px; line-height: 1.6; color: #333D4F">Kontopfändung über das Vollstreckungsgericht (§§ 829, 835 ZPO).</p></div><div style="padding: 24px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px"><div class="mbridge" style="display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 8px; align-items: center"><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Österreich</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Firmenbuch</div></div><span style="width: 28px; height: 28px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Deutschland</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Handelsregister</div></div></div><p style="margin: 0; padding-top: 12px; border-top: 1px solid #E6E1D6; font-size: 14px; line-height: 1.6; color: #333D4F">Wer haftet, wer vertritt, wo ist der Sitz.</p></div><div style="padding: 24px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px"><div class="mbridge" style="display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 8px; align-items: center"><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Österreich</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Ediktsdatei</div></div><span style="width: 28px; height: 28px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><div><div style="font-size: 12px; font-weight: 600; color: #8B6A2E">In Deutschland</div><div class="serif" style="font-size: 18px; line-height: 1.3; margin-top: 2px">Insolvenzbekanntmachungen</div></div></div><p style="margin: 0; padding-top: 12px; border-top: 1px solid #E6E1D6; font-size: 14px; line-height: 1.6; color: #333D4F">Laufende Insolvenzverfahren, abrufbar unter insolvenzbekanntmachungen.de.</p></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Entscheidungshilfe</p><h2 class="h2">Welcher Weg passt zu Ihrer Forderung in Deutschland?</h2></div><p class="lead" style="margin: 0">Das hängt davon ab, ob Sie schon einen Titel haben und ob Ihr Kunde bestreitet.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Ihre Lage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Passender Weg</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was Sie wissen sollten</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Sie haben einen österreichischen Titel</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Vollstreckung in Deutschland</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Kein Anerkennungsverfahren und keine Vollstreckungsklausel nötig (Art. 39 Brüssel-Ia-VO, § 1112 ZPO). Sie brauchen die Bescheinigung des österreichischen Gerichts (Art. 53 Brüssel-Ia-VO).</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde schweigt, kein Titel</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Deutsches Mahnverfahren oder Europäischer Zahlungsbefehl</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ohne Sitz in Deutschland ist für Ihren Mahnantrag das Amtsgericht Wedding zuständig (§ 689 Abs. 2 ZPO), ebenso für den Europäischen Zahlungsbefehl (§ 1087 ZPO).</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde bestreitet</td><td data-label="Passender Weg" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Klage</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Meist am Sitz des Kunden in Deutschland (Art. 4 Brüssel-Ia-VO) oder am vereinbarten Gerichtsstand.</td></tr></tbody></table></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ablauf</p><h2 class="h2">Ablauf: von Österreich aus, ohne Reise nach Deutschland</h2></div><p class="lead" style="margin: 0">Sie geben die Forderung einmal ab, alles Weitere läuft digital.</p></div><div style="position: relative; margin: 24px 0 20px"><div style="position: absolute; left: 22px; right: 22px; top: 21px; height: 2px; border-radius: 2px; background: #E6E1D6" aria-hidden="true"></div><ol style="list-style: none; margin: 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px" class="g5"><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">1</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Anfrage</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Rechnung, Mahnungen, Vertrag und gegebenenfalls Ihren Titel hochladen.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">2</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Ersteinschätzung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">zu Weg und Kosten. <span class="ph">[Reaktionszeit]</span></p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">3</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Auftrag</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Vollmacht digital erteilen.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">4</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Durchsetzung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Schreiben, Titel, Gerichtsvollzieher.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">5</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Auszahlung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Zahlungen leiten wir an Sie weiter.</p></li></ol></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px"><div class="serif" style="font-size: 26px; line-height: 1.25">Forderung prüfen lassen</div><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #D2D7E1">Ihre Forderung einreichen.** Sie brauchen: Rechnung, Vertrag oder Auftragsbestätigung, Mahnungen, gegebenenfalls Titel.</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> Anrufen</a></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Kosten</p><h2 class="h2">Kosten: wer zahlt das Inkasso in Deutschland?</h2></div><p class="lead" style="margin: 0">Ist Ihr Kunde in Verzug, muss er die notwendigen Kosten in der Regel ersetzen. Vorstrecken müssen Sie vor allem Gerichtskosten und den Vorschuss für den Gerichtsvollzieher.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Posten</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Betrag</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Wer trägt es am Ende?</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Ersteinschätzung</td><td data-label="Betrag" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[kostenlos oder Pauschale]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Sie</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Anwaltsschreiben</td><td data-label="Betrag" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Mahnverfahren bis Vollstreckungsbescheid</td><td data-label="Betrag" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Zunächst Sie, dann Ihr Kunde</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Gerichtsvollzieher, Kontopfändung</td><td data-label="Betrag" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Zunächst Sie, dann Ihr Kunde</td></tr></tbody></table></div><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #F4F1EA; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Zwischen Unternehmern kommen Verzugszinsen und 40 € Pauschale dazu (§ 288 BGB oder §§ 456, 458 UGB, je nach anwendbarem Recht). Ist beim Kunden nichts zu holen, bleiben die Kosten bei Ihnen. <span class="ph">[Stand der Kostenangaben]</span> Mehr: <a href="../kosten/">Kosten</a>.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Dauer</p><h2 class="h2">Wie lange dauert Inkasso in Deutschland?</h2></div><p class="lead" style="margin: 0">Zahlt der Kunde auf das Anwaltsschreiben, oft in wenigen Wochen. Mit Mahnverfahren und Pfändung mehrere Monate.</p></div><div style="position: relative; margin: 30px 0 20px"><div class="tlbar" style="position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 4px; background: #FFFFFF" aria-hidden="true"></div><div class="g4 tlg" style="position: relative; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 24px"><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Widerspruch gegen den Mahnbescheid</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">2 Wochen ab Zustellung (§ 692 Abs. 1 Nr. 3 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Einspruch gegen den Vollstreckungsbescheid</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">2 Wochen ab Zustellung (§§ 339, 700 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Einspruch gegen den Europäischen Zahlungsbefehl</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">30 Tage ab Zustellung (Art. 16 VO 1896/2006)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #B8945A; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Pfändung durch den Gerichtsvollzieher</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3"><span class="ph">[Dauer nach Erfahrung]</span></p></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Verjährung</p><h2 class="h2">Verjährung: österreichisches oder deutsches Recht?</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Meist verjährt Ihre Forderung nach drei Jahren, der Beginn hängt aber vom anwendbaren Recht ab.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Liefern Sie ohne Rechtswahl aus Österreich, gilt oft österreichisches Recht (Art. 4 Rom-I-VO). Dann verjährt die Forderung drei Jahre ab Fälligkeit (§ 1486 ABGB). Nach deutschem Recht laufen drei Jahre ab Ende des Jahres der Entstehung (§§ 195, 199 BGB). Eine Mahnung hält die Verjährung in keinem der beiden Länder auf. Mehr: <a href="../wann-verjaehren-rechnungen-forderungen/">Wann verjähren Rechnungen und Forderungen?</a></p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Insolvenz</p><h2 class="h2">Ihr Kunde in Deutschland ist insolvent?</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Dann melden wir Ihre Forderung beim Insolvenzverwalter an (§ 174 InsO). Ohne Anmeldung erhalten Sie keine Quote.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #1B2A4A; color: #FFFFFF"><div class="wrap side"><div><p class="eb" style="color: #E0B252">Warum wir</p><h2 class="h2" style="color: #FFFFFF">Warum eine deutsche Kanzlei?</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Weil das Verfahren in Deutschland läuft. Rechtsanwalt Jan Waßerfall ist hier zugelassen und vertritt Sie auch, wenn Ihr Kunde bestreitet. Besprechungen per Video, in Berlin oder in Kirchbach (Steiermark). <span class="ph">[Stand Kirchbach bestätigen]</span></p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Praxis</p><h2 class="h2">Beispiel: Holzbau aus der Steiermark, Kunde in Bayern</h2></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Konstruiertes Beispiel, kein Mandatsfall.</p><div class="g2" style="gap: 20px; margin: 10px 0 18px"><article style="padding: 30px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Holzbaubetrieb aus Leibnitz, 12.000 € offen</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Ein Holzbaubetrieb aus Leibnitz liefert für 12.000 € an eine GmbH in Regensburg. Die Rechnung bleibt offen, die GmbH ist laut Handelsregister aktiv. Auf das Anwaltsschreiben folgt nichts. Wir beantragen beim Amtsgericht Wedding einen Mahnbescheid, die GmbH widerspricht nicht. Mit dem Vollstreckungsbescheid lassen wir das Geschäftskonto pfänden.</p></article></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Thema</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../ratgeber/vollstreckungsbescheid/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Vollstreckungsbescheid</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/vermoegensauskunft/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Vermögensauskunft</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/europaeisches-mahnverfahren/" style="display: flex; flex
