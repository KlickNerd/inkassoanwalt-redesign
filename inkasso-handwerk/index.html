<section style="background: #F4F1EA; color: #1B2A4A; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #5A6172; margin-bottom: 32px"><a href="../" style="color: #5A6172">Startseite</a> / <a href="../leistungen/" style="color: #5A6172">Leistungen</a> / <span>Inkasso Handwerk</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Inkasso für Handwerksbetriebe</p><h1 class="serif h1" style="margin: 0; font-size: 46px; line-height: 1.08; font-weight: 400">Kunde zahlt Handwerkerrechnung nicht: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">Inkasso für Handwerksbetriebe</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Die Arbeit ist erledigt, aber Ihr Kunde zahlt nicht? Wir setzen Ihren Werklohn durch, vom Anwaltsschreiben bis zur Zwangsvollstreckung. Vorher prüfen wir Fälligkeit und Mängeleinwand.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #1B2A4A; color: #FFFFFF">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid #1B2A4A; color: #1B2A4A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #5A6172">Sie erhalten eine Einschätzung zu Erfolgsaussicht, Weg und Kosten.</p><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #DDD6C8; font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Für Betriebe in ganz Deutschland, Auftrag und Unterlagen digital</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungszahl und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="../assets/img/jan-wasserfall.jpg" alt="Rechtsanwalt Jan Waßerfall" style="display: block; width: 100%; height: 500px; object-fit: cover; object-position: 50% 20%; border-radius: 14px"><div style="position: absolute; left: 20px; bottom: 20px; background: #FFFFFF; color: #1B2A4A; padding: 14px 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(27,42,74,0.16)"><div class="serif" style="font-size: 18px">Jan Waßerfall</div><div style="font-size: 13px; color: #5A6172; margin-top: 2px">Rechtsanwalt · Kanzlei Waßerfall</div></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ausgangslage</p><h2 class="h2">Handwerkerrechnung nicht bezahlt: typische Fälle</h2></div><p class="lead" style="margin: 0">Diese Seite ist für Handwerks- und Baubetriebe, deren Kunde eine Rechnung nicht bezahlt.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Kunde schweigt seit Wochen, obwohl die Arbeit abgenommen ist.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Kunde behauptet nach Rechnungseingang Mängel und zahlt gar nichts.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ein Bauherr zahlt Abschlagsrechnungen nicht mehr, Sie sollen aber weiterarbeiten.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Die Rechnung ist älter als zwei Jahre und droht zu verjähren.</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Fälligkeit</p><h2 class="h2">Wann ist der Werklohn fällig?</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Der Werklohn ist grundsätzlich mit der Abnahme fällig (§ 641 Abs. 1 BGB). Abnahme heißt: Der Kunde billigt Ihre Arbeit als im Wesentlichen vertragsgemäß.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Verweigert der Kunde die Abnahme, ohne einen Mangel zu nennen, gilt das Werk als abgenommen, wenn Sie ihm nach Fertigstellung eine angemessene Frist gesetzt haben (§ 640 Abs. 2 BGB). Bei Verbrauchern muss das Schreiben auf diese Folge hinweisen. Bei Bauverträgen braucht es zusätzlich eine prüffähige Schlussrechnung (§ 650g Abs. 4 BGB).</p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Ihr wichtigstes Beweismittel: ein unterschriebenes Abnahmeprotokoll.</span></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Mängeleinwand</p><h2 class="h2">Mängeleinwand: wie viel darf der Kunde zurückhalten?</h2></div><p class="lead" style="margin: 0">Bei einem echten Mangel darf der Kunde einen angemessenen Teil zurückhalten, in der Regel das Doppelte der Kosten der Mängelbeseitigung (§ 641 Abs. 3 BGB). Den Rest muss er zahlen.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 360px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Posten</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Betrag</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Rechnung</td><td data-label="Betrag" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">8.000 €</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Kosten der Mangelbeseitigung</td><td data-label="Betrag" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">500 €</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; line-height: 1.6">Zurückhalten darf der Kunde in der Regel</td><td data-label="Betrag" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">1.000 €</td></tr></tbody></table></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Den unstreitigen Teil setzen wir sofort durch. Mehr dazu: <a href="../ratgeber/einwaende-des-kunden/">Einwände des Kunden</a>.</p></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Entscheidungshilfe</p><h2 class="h2">Inkasso im Handwerk: welcher Weg passt?</h2></div><p class="lead" style="margin: 0">Der Weg hängt davon ab, ob der Kunde Mängel behauptet und ob die Arbeit noch läuft.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Ihre Lage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Passender Weg</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was Sie wissen sollten</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Arbeit abgenommen, Kunde schweigt</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Anwaltsschreiben, dann Mahnbescheid</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ohne Widerspruch folgt der Titel ohne Verhandlung. Mehr: <a href="../mahnverfahren-anwalt/">Mahnverfahren</a></td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde behauptet Mängel</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Prüfung, dann Klage über den Restbetrag</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Mahnbescheid würde widersprochen. Beweise sichern: Fotos, Protokoll, Zeugen.</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Bauvertrag läuft, Abschläge bleiben aus</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Abschlagszahlung fordern, Sicherheit verlangen</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Abschläge nach Leistungsstand (§ 632a BGB), Sicherheit nach § 650f BGB.</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Bauwerk auf dem Grundstück des Kunden</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Sicherungshypothek</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Nur wenn der Besteller Eigentümer ist (§ 650e BGB).</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde ist insolvent</td><td data-label="Passender Weg" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Forderungsanmeldung</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><a href="../ratgeber/forderung-anmelden-insolvenz/">Forderung anmelden</a></td></tr></tbody></table></div></div></section><section class="sec" style="padding: 96px 0; background: #1B2A4A; color: #FFFFFF"><div class="wrap side"><div><p class="eb" style="color: #E0B252">Absicherung</p><h2 class="h2" style="color: #FFFFFF">Bauhandwerkersicherung und Sicherungshypothek</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Bei Bauverträgen können Sie vom Besteller eine Sicherheit für Ihre noch offene Vergütung verlangen, etwa eine Bankbürgschaft (§ 650f BGB). Das gilt auch noch nach der Abnahme.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Kommt die Sicherheit nicht fristgerecht, dürfen Sie die Arbeit einstellen oder kündigen (§ 650f Abs. 5 BGB). Ausgenommen sind Verbraucherbauverträge und öffentliche Auftraggeber (§ 650f Abs. 6 BGB). Gehört dem Besteller das Grundstück, kommt eine Sicherungshypothek hinzu (§ 650e BGB).</p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Muster</p><h2 class="h2">Muster: Mahnung für die Handwerkerrechnung</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Eine Mahnung mit fester Frist setzt Ihren Kunden in Verzug, falls er es nicht schon ist. Dann trägt er Zinsen und Anwaltskosten (§§ 280, 286, 288 BGB).</p><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Muster zur Orientierung, an Ihren Fall anpassen. Ersetzt keine Prüfung im Einzelfall.</p><div style="margin: 18px 0 22px; padding: 40px 44px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E6E1D6; box-shadow: 0 12px 30px rgba(27,42,74,0.08); max-width: 760px; position: relative"><span style="position: absolute; top: 18px; right: 20px; font-size: 12px; font-weight: 600; color: #8B6A2E; background: #F4F1EA; padding: 4px 10px; border-radius: 4px">Muster</span><p class="serif" style="margin: 0 0 14px; font-size: 17px; line-height: 1.7; color: #1B2A4A"><strong>Betreff: Mahnung, Rechnung Nr. <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Nummer]</span> vom <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Datum]</span></strong></p><p class="serif" style="margin: 0 0 14px; font-size: 17px; line-height: 1.7; color: #1B2A4A">Sehr geehrte Frau <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Name]</span>, sehr geehrter Herr <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Name]</span>,</p><p class="serif" style="margin: 0 0 14px; font-size: 17px; line-height: 1.7; color: #1B2A4A">für die am <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Datum]</span> abgenommenen Arbeiten am Objekt <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Adresse]</span> haben wir Ihnen <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Betrag]</span> € berechnet. Eine Zahlung ist bis heute nicht eingegangen. Bitte überweisen Sie ihn bis zum <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Datum, etwa 10 Tage]</span> auf <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[IBAN]</span>.</p><p class="serif" style="margin: 0 0 14px; font-size: 17px; line-height: 1.7; color: #1B2A4A">Geht die Zahlung bis dahin nicht ein, übergeben wir die Forderung ohne weitere Ankündigung unserem Rechtsanwalt. Die Kosten dafür können wir als Verzugsschaden von Ihnen verlangen.</p><p class="serif" style="margin: 0 0 14px; font-size: 17px; line-height: 1.7; color: #1B2A4A">Mit freundlichen Grüßen, <span style="padding: 0 4px; border-bottom: 1px dashed #B8945A; background: #FAF7F0; color: #8B6A2E">[Betrieb]</span></p></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Eine Mahnung genügt. Ausführlich: <a href="../ratgeber/mahnung-muster/">Mahnung Muster</a>.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Kosten und Dauer</p><h2 class="h2">Kosten und Dauer beim Inkasso für Handwerker</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ist Ihr Kunde in Verzug, muss er die notwendigen Anwaltskosten in der Regel ersetzen (§§ 280, 286 BGB). Vorstrecken müssen Sie vor allem Gerichtskosten.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Dazu kommen Verzugszinsen: 9 Prozentpunkte über dem Basiszinssatz und 40 € Pauschale gegenüber Unternehmern, 5 Prozentpunkte gegenüber Verbrauchern (§ 288 Abs. 1, 2 und 5 BGB). Ist beim Kunden nichts zu holen, bleiben die Kosten bei Ihnen. <span class="ph">[Kostenbeispiel nach Freigabe]</span> Mehr: <a href="../kosten/">Kosten</a>. Dauer: nach dem Anwaltsschreiben oft wenige Wochen, mit Gericht und Vollstreckung mehrere Monate.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Verjährung</p><h2 class="h2">Werklohn: Verjährung nach drei Jahren</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Werklohn verjährt in drei Jahren, gerechnet ab dem Ende des Jahres, in dem er fällig wurde (§§ 195, 199 BGB). Eine Mahnung hält die Verjährung nicht auf, ein Mahnbescheid schon (§ 204 BGB). Mehr: <a href="../wann-verjaehren-rechnungen-forderungen/">Wann verjähren Rechnungen und Forderungen?</a></p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Praxis</p><h2 class="h2">Beispiel aus der Praxis: Badsanierung, 9.400 € offen</h2></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Konstruiertes Beispiel, kein Mandatsfall.</p><div class="g2" style="gap: 20px; margin: 10px 0 18px"><article style="padding: 30px; border-radius: 10px; background: #F4F1EA; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Sanitärbetrieb, Badsanierung</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Ein Sanitärbetrieb saniert ein Bad in einer vermieteten Wohnung. Der Eigentümer nimmt ab, zahlt aber nicht und rügt nach zwei Mahnungen eine undichte Silikonfuge. Der Mangel kostet rund 300 €.</p></article><article style="padding: 30px; border-radius: 10px; background: #F4F1EA; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Ergebnis</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Wir fordern 9.400 € abzüglich 600 € Einbehalt und kündigen den Mahnbescheid an. Der Kunde zahlt 8.800 €, nach Beseitigung der Fuge auch den Einbehalt.</p></article></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Thema</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../ratgeber/mahnung-muster/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Mahnung Muster: 1. Mahnung, 2. Mahnung, letzte Mahnung</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/einwaende-des-kunden/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Einwände des Kunden: Mängel, Aufrechnung, Zurückbehaltung</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../wann-verjaehren-rechnungen-forderungen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Wann verjähren Rechnungen und Forderungen?</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../inkasso-unternehmen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso für Unternehmen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../mahnverfahren-anwalt/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Gerichtliches Mahnverfahren</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px"><div class="serif" style="font-size: 26px; line-height: 1.25">Forderung prüfen lassen</div><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #D2D7E1">Ihre Rechnung jetzt einreichen.** Sie brauchen: Angebot oder Auftrag, Abnahmeprotokoll, Rechnung, Mahnungen, Fotos und Schriftverkehr. <span class="ph">[Reaktionszeit]</span></p></div>
