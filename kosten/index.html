<section style="background: #1B2A4A; color: #FFFFFF; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #AEB6C6; margin-bottom: 32px"><a href="../" style="color: #AEB6C6">Startseite</a> / <span>Kosten</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="color: #E0B252">Kosten</p><h1 class="serif h1" style="margin: 0; font-size: 46px; line-height: 1.08; font-weight: 400">Inkassokosten beim Anwalt: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">was Sie zahlen und was Ihr Kunde ersetzen muss</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #D9DDE6">Was kostet es, eine Forderung durch einen Anwalt einziehen zu lassen, und wer zahlt am Ende? Kurz gesagt: Ist Ihr Kunde in Verzug, muss er die Kosten in der Regel ersetzen. Vorstrecken müssen Sie vor allem Gerichtskosten. Hier sehen Sie, welche Kosten in welcher Stufe entstehen, mit Rechenbeispielen.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #AEB6C6">Vor jedem Schritt nennen wir Ihnen die Kosten.</p></div><div style="position: relative"><img src="../assets/img/besprechung.jpg" alt="Besprechung von Rechnungen und Vertrag am Schreibtisch" style="display: block; width: 100%; height: 460px; object-fit: cover; object-position: 60% 50%; border-radius: 14px"></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Grundsatz</p><h2 class="h2">Wer zahlt die Inkassokosten?</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ihr Kunde, wenn er in Verzug ist und zahlen kann. Die notwendigen Kosten des Anwalts sind dann ein Verzugsschaden, den er ersetzen muss (§§ 280 Abs. 1 und 2, 286 BGB).</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">In Verzug ist Ihr Kunde, wenn er nach Fälligkeit auf eine Mahnung nicht zahlt. Ein Unternehmen kommt spätestens 30 Tage nach Fälligkeit und Zugang der Rechnung auch ohne Mahnung in Verzug (§ 286 Abs. 3 BGB). Die Kosten der ersten Mahnung, die den Verzug erst auslöst, muss Ihr Kunde deshalb nicht ersetzen.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Rechenbeispiele</p><h2 class="h2">Inkassokosten nach RVG: Rechenbeispiele für 500, 2.000 und 10.000 €</h2></div><p class="lead" style="margin: 0">Die Anwaltsgebühren richten sich nach dem Rechtsanwaltsvergütungsgesetz (RVG) und steigen mit der Höhe der Forderung. Die Gerichtskosten richten sich nach dem Gerichtskostengesetz (GKG).</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 900px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Forderung</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Außergerichtlich (Anwaltsschreiben)</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Mahnverfahren bis Titel</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Vollstreckung (je Antrag)</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Wer trägt es am Ende?</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Forderung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">500 €</td><td data-label="Außergerichtlich (Anwaltsschreiben)" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Mahnverfahren bis Titel" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG und GKG]</span></td><td data-label="Vollstreckung (je Antrag)" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG und GvKostG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr><tr style="vertical-align: top"><td data-label="Forderung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">2.000 €</td><td data-label="Außergerichtlich (Anwaltsschreiben)" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Mahnverfahren bis Titel" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG und GKG]</span></td><td data-label="Vollstreckung (je Antrag)" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG und GvKostG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr><tr style="vertical-align: top"><td data-label="Forderung" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">10.000 €</td><td data-label="Außergerichtlich (Anwaltsschreiben)" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Mahnverfahren bis Titel" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG und GKG]</span></td><td data-label="Vollstreckung (je Antrag)" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG und GvKostG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr></tbody></table></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160"><span class="ph">[Stand der Berechnung und Annahmen (Gebührensatz, Auslagenpauschale, ohne Umsatzsteuer) nach Freigabe durch Jan]</span></p><h3 class="serif" style="margin: 26px 0 12px; font-size: 23px; font-weight: 400">So setzen sich die Beträge zusammen</h3><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Stufe</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Gebühr</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Grundlage</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Stufe" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Anwaltsschreiben</td><td data-label="Gebühr" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Geschäftsgebühr. Bei einer unbestrittenen Forderung in der Regel 0,9, zahlt Ihr Kunde schon auf das erste Schreiben, 0,5</td><td data-label="Grundlage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Nr. 2300 VV RVG</td></tr><tr style="vertical-align: top"><td data-label="Stufe" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Auslagen</td><td data-label="Gebühr" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Pauschale für Post und Telekommunikation: 20 % der Gebühren, höchstens 20 €</td><td data-label="Grundlage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Nr. 7002 VV RVG</td></tr><tr style="vertical-align: top"><td data-label="Stufe" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Mahnverfahren, Anwalt</td><td data-label="Gebühr" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Verfahrensgebühr 1,0, für den Vollstreckungsbescheid 0,5. Die Geschäftsgebühr wird zur Hälfte angerechnet</td><td data-label="Grundlage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Nr. 3305, 3308 VV RVG, Vorbem. 3 Abs. 4 VV RVG</td></tr><tr style="vertical-align: top"><td data-label="Stufe" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Mahnverfahren, Gericht</td><td data-label="Gebühr" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">0,5 Gerichtsgebühr, mindestens <span class="ph">[Mindestbetrag]</span></td><td data-label="Grundlage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Nr. 1100 KV GKG</td></tr><tr style="vertical-align: top"><td data-label="Stufe" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Zwangsvollstreckung</td><td data-label="Gebühr" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">0,3 Verfahrensgebühr je Maßnahme, dazu Kosten des Gerichtsvollziehers</td><td data-label="Grundlage" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Nr. 3309 VV RVG, GvKostG</td></tr></tbody></table></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Vorschüsse</p><h2 class="h2">Was Sie vorstrecken müssen: Vorschüsse</h2></div><p class="lead" style="margin: 0">Vorstrecken müssen Sie vor allem die Gerichtskosten. Ohne sie wird das Gericht nicht tätig.</p></div><div class="g2" style="gap: 16px; margin: 8px 0 18px"><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Mahnverfahren</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Den Mahnbescheid erlässt das Gericht erst, wenn die Gebühr bezahlt ist.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Klage</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Die Klage wird erst zugestellt, wenn der Gerichtskostenvorschuss bezahlt ist (§ 12 Abs. 1 GKG).</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Gerichtsvollzieher</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Er kann einen Vorschuss auf seine Kosten verlangen (§ 4 GvKostG).</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Anwalt</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">Ein Vorschuss ist möglich (§ 9 RVG). <span class="ph">[Handhabung der Kanzlei nach Freigabe durch Jan]</span></p></div></div></div><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #F4F1EA; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Zahlt Ihr Kunde oder bringt die Vollstreckung Geld, machen wir diese Beträge gegen ihn geltend. Die Kosten der Zwangsvollstreckung trägt er, soweit sie notwendig waren (§ 788 ZPO).</span></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Zinsen und Pauschale</p><h2 class="h2">Verzugszinsen und 40 € Pauschale: was Ihr Kunde zusätzlich zahlt</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Gegenüber Unternehmen stehen Ihnen ab Verzug Zinsen von 9 Prozentpunkten über dem Basiszinssatz und eine Pauschale von 40 € zu (§ 288 Abs. 2 und 5 BGB).</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Die 40 € werden auf die Anwaltskosten angerechnet, Sie erhalten sie also nicht zusätzlich. Ist Ihr Kunde Verbraucher, beträgt der Zinssatz 5 Prozentpunkte über dem Basiszinssatz, eine Pauschale gibt es nicht (§ 288 Abs. 1 BGB). Die Zinsen berechnet der <a href="https://www.wasserfall.com/verzugszinsrechner/">Verzugszinsrechner</a>.</p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span><strong>Mahngebühren für eigene Mahnungen:</strong> Nach Verzug können Sie die tatsächlichen Kosten Ihrer Mahnung verlangen, etwa Porto. Ihre Arbeitszeit gehört nicht dazu. Mehr dazu: <a href="../ratgeber/mahngebuehren-verzugspauschale/">Mahngebühren und Verzugspauschale</a></span></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Restrisiko</p><h2 class="h2">Wann Sie die Kosten selbst tragen: das Restrisiko</h2></div><p class="lead" style="margin: 0">Ein Risiko bleibt: Ist bei Ihrem Kunden nichts zu holen, bleiben die Kosten bei Ihnen. Ein Erstattungsanspruch hilft nur, wenn er sich durchsetzen lässt.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 360px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Lage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Folge für die Kosten</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Kunde ist zahlungsunfähig oder insolvent</td><td data-label="Folge für die Kosten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Sie tragen die vorgestreckten Kosten. In der Insolvenz melden wir sie mit der Forderung an, Sie erhalten nur die Quote.</td></tr><tr style="vertical-align: top"><td data-label="Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Kunde war noch nicht in Verzug</td><td data-label="Folge für die Kosten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Die Anwaltskosten für dieses Schreiben muss er nicht ersetzen.</td></tr><tr style="vertical-align: top"><td data-label="Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Sie verlieren einen Prozess</td><td data-label="Folge für die Kosten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Sie tragen die Gerichtskosten und die Anwaltskosten beider Seiten (§ 91 ZPO).</td></tr><tr style="vertical-align: top"><td data-label="Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; line-height: 1.6">Sie sind zum Vorsteuerabzug berechtigt</td><td data-label="Folge für die Kosten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Die Umsatzsteuer auf die Anwaltsrechnung ersetzt Ihr Kunde nicht. Sie ziehen sie als Vorsteuer ab.</td></tr><tr style="vertical-align: top"><td data-label="Lage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; line-height: 1.6">Sie haben erst ein Inkassobüro und danach einen Anwalt beauftragt</td><td data-label="Folge für die Kosten" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Die doppelten Kosten muss Ihr Kunde unter Umständen nicht vollständig ersetzen.</td></tr></tbody></table></div><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #F4F1EA; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Deshalb prüfen wir vor dem ersten Schritt Forderung und Schuldner, etwa im Handelsregister und auf laufende Insolvenzverfahren. Ist Ihre Forderung unbestritten, wählen wir das Mahnverfahren, das weniger kostet als eine Klage. Vor jedem Schritt, der Kosten auslöst, stimmen wir uns mit Ihnen ab.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Abrechnung</p><h2 class="h2">Abrechnung: RVG oder Vereinbarung</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Wir rechnen nach dem RVG oder nach einer Vergütungsvereinbarung ab, die wir vorab schriftlich mit Ihnen treffen. <span class="ph">[Kostenaussage und Kosten der Ersteinschätzung nach Freigabe durch Jan]</span></p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Für Forderungen gegen Kunden in Österreich gelten für das Verfahren dort österreichische Gebühren. Mehr auf der Seite <a href="../inkasso-oesterreich/">Inkasso Österreich</a>.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Thema</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../inkasso-unternehmen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso für Unternehmen: Ablauf und Leistungen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/rechte-bei-zahlungsverzug/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Rechte bei Zahlungsverzug: Zinsen, Pauschale, Kosten</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/klagen-oder-nicht/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Klagen oder nicht? Das Kostenrisiko einschätzen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/forderungsausfall-umsatzsteuer/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Forderungsausfall und Umsatzsteuer</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../mahnverfahren-anwalt/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Gerichtliches Mahnverfahren</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
