<section style="background: #F4F1EA; color: #1B2A4A; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #5A6172; margin-bottom: 32px"><a href="../" style="color: #5A6172">Startseite</a> / <a href="../leistungen/" style="color: #5A6172">Leistungen</a> / <span>Inkasso Vermieter</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Inkasso für Vermieter</p><h1 class="serif h1" style="margin: 0; font-size: 46px; line-height: 1.08; font-weight: 400">Mieter zahlt Miete nicht: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">Mietrückstand und Mietschulden eintreiben</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Ihr Mieter zahlt nicht, oder er ist ausgezogen und hat Schulden hinterlassen? Wir treiben Mietrückstände, Nebenkostennachzahlungen und Schadensersatz ein, vom Anwaltsschreiben über das Mahnverfahren bis zur Pfändung. Für private und gewerbliche Vermieter.</p><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F"><span class="ph">[Offene Entscheidung 7: Übernimmt die Kanzlei auch Kündigung und Räumung? Bis zur Entscheidung behandelt diese Seite nur das Eintreiben von Geld.]</span></p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #1B2A4A; color: #FFFFFF">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid #1B2A4A; color: #1B2A4A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #5A6172">Sie erhalten eine Einschätzung zu Erfolgsaussicht, Weg und Kosten.</p><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #DDD6C8; font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Wohnraum und Gewerberaum, bundesweit, Auftrag digital</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungszahl und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="../assets/img/berlin.jpg" alt="Wohnhäuser an einer Berliner Straße" style="display: block; width: 100%; height: 520px; object-fit: cover; object-position: 15% 50%; border-radius: 14px"></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ausgangslage</p><h2 class="h2">Mietschulden eintreiben: typische Fälle</h2></div><p class="lead" style="margin: 0">Diese Seite ist für Vermieter, die Geld von einem aktuellen oder früheren Mieter verlangen.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Mieter zahlt seit zwei Monaten keine Miete und reagiert nicht.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Der Mieter ist ausgezogen, die Kaution deckt die Rückstände nicht.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Die Nebenkostenabrechnung ergibt eine Nachzahlung, die der Mieter ignoriert.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ein Gewerbemieter hat sein Geschäft aufgegeben und die letzten Mieten nicht gezahlt.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Sie haben schon ein Urteil, aber der frühere Mieter ist unbekannt verzogen.</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #1B2A4A; color: #FFFFFF"><div class="wrap side"><div><p class="eb" style="color: #E0B252">Verzug</p><h2 class="h2" style="color: #FFFFFF">Ab wann ist der Mieter mit der Miete in Verzug?</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Die Miete ist bis zum dritten Werktag des Monats zu zahlen (§ 556b Abs. 1 BGB, für Gewerberäume über § 579 Abs. 2 BGB). Zahlt der Mieter nicht, ist er ohne Mahnung in Verzug, weil der Termin im Kalender feststeht (§ 286 Abs. 2 Nr. 1 BGB).</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Ab dann schuldet er Verzugszinsen (§ 288 BGB). Beauftragen Sie danach einen Anwalt, muss er in der Regel auch dessen Kosten ersetzen (§§ 280, 286 BGB).</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Unterlagen</p><h2 class="h2">Welche Belege Sie für den Mietrückstand brauchen</h2></div><p class="lead" style="margin: 0">Je vollständiger die Unterlagen, desto weniger Rückfragen auf dem Weg zum Titel.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Mietvertrag mit allen Nachträgen und Mieterhöhungen</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Mieterkonto oder Kontoauszüge, aus denen die fehlenden Zahlungen hervorgehen</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Nebenkostenabrechnung mit Zugangsnachweis</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Übergabeprotokoll und Kautionsabrechnung, wenn der Mieter ausgezogen ist</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Mahnungen und Schriftverkehr, letzte bekannte Anschrift des Mieters</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Kaution</p><h2 class="h2">Kaution: Verrechnung in der Regel erst nach Mietende</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Während das Mietverhältnis läuft, dürfen Sie die Kaution in der Regel nicht für streitige Rückstände verwenden. Nach dem Ende rechnen Sie ab und verrechnen offene Forderungen mit der Kaution.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Für die Abrechnung haben Sie eine angemessene Prüffrist. Was die Kaution nicht deckt, treiben wir ein.</p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Beachten Sie bei Schäden an der Wohnung die kurze Frist: Ersatzansprüche wegen Veränderung oder Verschlechterung der Mietsache verjähren in sechs Monaten ab Rückgabe (§ 548 Abs. 1 BGB).</span></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Entscheidungshilfe</p><h2 class="h2">Mietrückstand einklagen: welcher Weg passt?</h2></div><p class="lead" style="margin: 0">Bestreitet der Mieter nicht, reicht oft das Mahnverfahren. Bei Einwänden wie Mietminderung geht es vor Gericht.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Ihre Lage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Passender Weg</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was Sie wissen sollten</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Mieter schweigt</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Anwaltsschreiben, dann Mahnbescheid</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ohne Widerspruch folgt der Titel ohne Verhandlung. Mehr: <a href="../mahnverfahren-anwalt/">Mahnverfahren</a></td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Mieter mindert oder rechnet auf</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Klage, oft im Urkundenprozess</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Mit Mietvertrag und Mieterkonto als Urkunden ist ein Vorbehaltsurteil möglich, bevor über die Minderung gestritten wird (§§ 592 ff. ZPO).</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Mieter ausgezogen, Adresse unbekannt</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Adressermittlung, dann Titel</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Anfrage beim Einwohnermeldeamt. Mehr: <a href="../verjaehrungsstopp-bei-verschwundenen-schuldnern-was-tun-wenn-die-adresse-weg-ist/">Schuldner verschwunden</a></td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Titel liegt vor</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Zwangsvollstreckung</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Vermögensauskunft, Konto- oder Lohnpfändung. Mehr: <a href="../zwangsvollstreckung-glaeubiger/">Zwangsvollstreckung</a></td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kündigung und Räumung nötig</td><td data-label="Passender Weg" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[Offene Entscheidung 7]</span></td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Kündigung und Räumungsklage sind eigene Verfahren. Die Zahlungsforderung bleibt davon unberührt.</td></tr></tbody></table></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Kosten und Dauer</p><h2 class="h2">Kosten und Dauer</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ist der Mieter in Verzug, muss er die notwendigen Anwaltskosten in der Regel ersetzen. Vorstrecken müssen Sie vor allem Gerichtskosten.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Ist beim Mieter nichts zu holen, bleiben die Kosten bei Ihnen. Deshalb klären wir vorab, ob es Einkommen oder Konten gibt. <span class="ph">[Kostenbeispiel nach Freigabe]</span> Mehr: <a href="../kosten/">Kosten</a>. Dauer: nach dem Anwaltsschreiben oft wenige Wochen, mit Gericht und Vollstreckung mehrere Monate.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Verjährung</p><h2 class="h2">Verjährung von Mietschulden</h2></div><p class="lead" style="margin: 0">Mietrückstände verjähren in drei Jahren ab dem Ende des Jahres, in dem die Miete fällig war (§§ 195, 199 BGB).</p></div><div style="position: relative; margin: 30px 0 20px"><div class="tlbar" style="position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 4px; background: #F4F1EA" aria-hidden="true"></div><div class="g4 tlg" style="position: relative; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 24px"><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Mietrückstände</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">3 Jahre ab Jahresende der Fälligkeit (§§ 195, 199 BGB)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Nebenkostennachzahlung Wohnraum</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">Mitteilung spätestens 12 Monate nach Ende des Abrechnungszeitraums (§ 556 Abs. 3 BGB)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Schäden an der Mietsache</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">6 Monate ab Rückgabe (§ 548 Abs. 1 BGB)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #B8945A; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Titel</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">30 Jahre (§ 197 Abs. 1 Nr. 3 BGB)</p></div></div></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Eine Mahnung hält die Verjährung nicht auf, ein Mahnbescheid schon (§ 204 BGB).</p></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Praxis</p><h2 class="h2">Beispiel aus der Praxis: Mieter ausgezogen, 4.200 € offen</h2></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Konstruiertes Beispiel, kein Mandatsfall.</p><div class="g2" style="gap: 20px; margin: 10px 0 18px"><article style="padding: 30px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Vermieterin aus Spandau</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Eine Vermieterin aus Spandau verrechnet nach dem Auszug die Kaution von 2.100 €. Offen bleiben 4.200 € Miete und Nebenkosten. Der Mieter ist neu gemeldet in Brandenburg.</p></article><article style="padding: 30px; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Ablauf</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Wir schreiben ihn an, er reagiert nicht. Wir beantragen den Mahnbescheid, er widerspricht nicht. Mit dem Vollstreckungsbescheid beantragen wir die Pfändung seines Lohns.</p></article></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Thema</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../wann-verjaehren-rechnungen-forderungen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Wann verjähren Rechnungen und Forderungen?</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Vermögensauskunft: was Gläubiger erfahren</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Kontopfändung oder Lohnpfändung?</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Ratenzahlungsvereinbarung richtig aufsetzen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../inkasso-privatpersonen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso für Privatpersonen</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../zwangsvollstreckung-glaeubiger/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #F4F1EA; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Zwangsvollstreckung</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px"><div class="serif" style="font-size: 26px; line-height: 1.25">Forderung prüfen lassen</div><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #D2D7E1">Mietrückstand jetzt einreichen.** Sie brauchen: Mietvertrag, Mieterkonto, Mahnungen und die letzte Anschrift des Mieters. <span class="ph">[Reaktionszeit]</span></p></div>
