<p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #D9DDE6">Ich bin Rechtsanwalt Jan Waßerfall. Ich vertrete Gläubiger, die auf ihr Geld warten, und setze offene Forderungen durch, in Deutschland und in Österreich. Hier finden Sie meinen Werdegang, meine Schwerpunkte und den direkten Weg zu mir.</p>

<p class="lead" style="margin: 18px 0 0">Jan Waßerfall ist seit dem 22.11.2008 als Rechtsanwalt zugelassen und Mitglied der Rechtsanwaltskammer Berlin. Seine Kanzlei liegt am Kaiserdamm 100 in Berlin.</p>

<p class="eb">Österreich</p>
<h2 class="serif" style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 400">Inkasso in Österreich: Tätigkeit in beiden Ländern</h2>
<p style="margin: 16px 0 0; font-size: 16px; line-height: 1.7; color: #333D4F">Ich setze Forderungen deutscher Gläubiger auch gegen Schuldner in Österreich durch, und Forderungen österreichischer Gläubiger gegen Schuldner in Deutschland.</p>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #333D4F">Viele meiner Mandanten liefern in beide Länder. Ein deutscher Titel lässt sich in Österreich ohne eigenes Anerkennungsverfahren vollstrecken (Art. 39 Brüssel-Ia-VO). Ich bin in Deutschland zugelassen und über das EIRAG auch in Österreich tätig. In der Regel arbeite ich dabei mit einer österreichischen Kooperationskanzlei zusammen. Für Besprechungen in Österreich gibt es ein Büro in Kirchbach 82, A-8082 Kirchbach in der Steiermark <span class="ph">[Stand des Büros bestätigen]</span>. <span class="ph">[Name der Kooperationskanzlei nur mit Zustimmung]</span></p>
<p style="margin: 16px 0 0; font-size: 15px">Mehr dazu: <a href="../inkasso-oesterreich/" style="font-weight: 600">Inkasso Österreich</a> und <a href="../forderung-deutschland-eintreiben/" style="font-weight: 600">Forderung in Deutschland eintreiben</a>.</p>
