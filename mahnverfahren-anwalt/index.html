<section style="background: #1B2A4A; color: #FFFFFF; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #AEB6C6; margin-bottom: 32px"><a href="../" style="color: #AEB6C6">Startseite</a> / <a href="../leistungen/" style="color: #AEB6C6">Leistungen</a> / <span>Mahnverfahren mit Anwalt</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="color: #E0B252">Gerichtliches Mahnverfahren</p><h1 class="serif h1" style="margin: 0; font-size: 46px; line-height: 1.08; font-weight: 400">Mahnverfahren mit Anwalt: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">vom Mahnbescheid zum vollstreckbaren Titel</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #D9DDE6">Ihr Kunde zahlt nicht und reagiert nicht? Mit dem gerichtlichen Mahnverfahren kommen Sie ohne Klage und ohne Verhandlung zu einem vollstreckbaren Titel. Wir beantragen Mahnbescheid und Vollstreckungsbescheid, überwachen die Fristen und führen das Verfahren weiter, wenn Ihr Kunde widerspricht.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #AEB6C6">Sie erhalten eine Einschätzung, ob das Mahnverfahren oder eine Klage der bessere Weg ist.</p><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.18); font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Mahnverfahren, Klage und Vollstreckung aus einer Hand</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Elektronische Einreichung beim Mahngericht</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungszahl und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="../assets/img/besprechung.jpg" alt="Besprechung von Rechnungen und Vertrag am Schreibtisch" style="display: block; width: 100%; height: 480px; object-fit: cover; object-position: 60% 50%; border-radius: 14px"></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Grundlagen</p><h2 class="h2">Gerichtliches Mahnverfahren: zum Titel ohne Klage</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Das gerichtliche Mahnverfahren ist ein schriftliches Verfahren, in dem das Gericht nur die Form prüft, nicht ob die Forderung besteht (§§ 688 ff. ZPO). Widerspricht Ihr Kunde nicht, haben Sie nach wenigen Wochen einen Vollstreckungsbescheid.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Der Vollstreckungsbescheid wirkt wie ein Urteil: Mit ihm lassen Sie pfänden. Das Verfahren gibt es nur für Geldforderungen in Euro.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Entscheidungshilfe</p><h2 class="h2">Mahnverfahren oder Klage: welcher Weg passt?</h2></div><p class="lead" style="margin: 0">Das Mahnverfahren passt, wenn Ihr Kunde schweigt. Bestreitet er die Forderung schon jetzt, ist die Klage oft schneller.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Ihre Lage</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Passender Weg</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was Sie wissen sollten</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde reagiert nicht, keine Einwände</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Mahnverfahren</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Günstig und schnell. Ohne Widerspruch folgt der Vollstreckungsbescheid.</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Kunde hat Mängel gerügt oder bestreitet</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Klage</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ein Widerspruch ist zu erwarten. Der Umweg über das Mahnverfahren kostet dann Zeit.</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Ihre eigene Leistung ist noch nicht erbracht</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Klage oder abwarten</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Hängt die Zahlung von Ihrer Gegenleistung ab, ist das Mahnverfahren ausgeschlossen (§ 688 Abs. 2 Nr. 2 ZPO).</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Anschrift des Kunden unbekannt</td><td data-label="Passender Weg" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Erst Anschrift ermitteln</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Eine öffentliche Zustellung ist im Mahnverfahren nicht möglich (§ 688 Abs. 2 Nr. 3 ZPO).</td></tr><tr style="vertical-align: top"><td data-label="Ihre Lage" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Verjährung droht zum Jahresende</td><td data-label="Passender Weg" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Mahnverfahren</td><td data-label="Was Sie wissen sollten" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Der rechtzeitig beantragte Mahnbescheid hemmt die Verjährung (§ 204 Abs. 1 Nr. 3 BGB).</td></tr></tbody></table></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Mehr dazu auf wasserfall.com: <a href="https://www.wasserfall.com/mahnverfahren-vs-klage-wann-lohnt-sich-welcher-weg/">Mahnverfahren oder Klage?</a></p></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ablauf</p><h2 class="h2">Ablauf: vom Mahnbescheid zum Vollstreckungsbescheid</h2></div><p class="lead" style="margin: 0">Das Verfahren läuft in zwei Stufen. Zuerst der Mahnbescheid, dann der Vollstreckungsbescheid.</p></div><div style="position: relative; margin: 24px 0 20px"><div style="position: absolute; left: 22px; right: 22px; top: 21px; height: 2px; border-radius: 2px; background: #E6E1D6" aria-hidden="true"></div><ol style="list-style: none; margin: 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px" class="g5"><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">1</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Prüfung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Wir prüfen Forderung, Zinsen und Kunden, etwa im Handelsregister und auf ein laufendes Insolvenzverfahren. <span class="ph">[Reaktionszeit]</span></p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">2</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Antrag auf Mahnbescheid</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Wir stellen den Antrag elektronisch beim zentralen Mahngericht. Zuständig ist das Mahngericht für Ihren Sitz (§ 689 Abs. 2 ZPO), für Berliner und Brandenburger Gläubiger das Amtsgericht Wedding.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">3</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Zustellung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Das Gericht stellt den Mahnbescheid Ihrem Kunden zu. Er hat zwei Wochen für einen Widerspruch (§ 692 Abs. 1 Nr. 3 ZPO).</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">4</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Vollstreckungsbescheid</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Kommt kein Widerspruch, beantragen wir den Vollstreckungsbescheid (§ 699 ZPO). Gegen ihn hat Ihr Kunde nochmals zwei Wochen für einen Einspruch (§§ 339, 700 ZPO).</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">5</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Vollstreckung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Mit dem Vollstreckungsbescheid geht es direkt zur <a href="../zwangsvollstreckung-glaeubiger/">Zwangsvollstreckung</a>.</p></li></ol></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px"><div class="serif" style="font-size: 26px; line-height: 1.25">Forderung prüfen lassen</div><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #D2D7E1">Ihre Forderung in wenigen Minuten einreichen.** Sie brauchen: Rechnung, Vertrag oder Auftragsbestätigung, Mahnungen.</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> Anrufen</a></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Widerspruch</p><h2 class="h2">Widerspruch gegen den Mahnbescheid: so geht es weiter</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Widerspricht Ihr Kunde, geht das Verfahren auf Antrag an das Streitgericht, also das Gericht, das über die Klage entscheidet, und wird zur normalen Klage (§ 696 ZPO). Dort muss die Forderung begründet und bewiesen werden (§ 697 ZPO).</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Hier zeigt sich der Unterschied zum Inkassobüro: Im Mahnverfahren darf ein Inkassodienstleister Sie vertreten, im streitigen Verfahren nicht (§ 79 Abs. 2 ZPO). Wir führen das Verfahren ohne Wechsel weiter. Vor dem Landgericht ist ein Anwalt ohnehin Pflicht (§ 78 ZPO).</p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Wichtig: Bleibt das Verfahren nach dem Widerspruch liegen, endet die Hemmung der Verjährung sechs Monate später (§ 204 Abs. 2 BGB). Wir beantragen die Abgabe deshalb zügig. Mehr dazu: <a href="#">Widerspruch gegen den Mahnbescheid</a>.</span></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Kosten</p><h2 class="h2">Was kostet das Mahnverfahren mit Anwalt?</h2></div><p class="lead" style="margin: 0">Die Kosten trägt am Ende Ihr Kunde, wenn er in Verzug ist und das Verfahren verliert. Vorschießen müssen Sie die Gerichtsgebühr.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Forderung</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Gerichtsgebühr Mahnbescheid</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Anwaltsgebühr Mahn- und Vollstreckungsbescheid</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Wer trägt es am Ende?</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Forderung" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">2.000 €</td><td data-label="Gerichtsgebühr Mahnbescheid" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach GKG]</span></td><td data-label="Anwaltsgebühr Mahn- und Vollstreckungsbescheid" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr><tr style="vertical-align: top"><td data-label="Forderung" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">10.000 €</td><td data-label="Gerichtsgebühr Mahnbescheid" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach GKG]</span></td><td data-label="Anwaltsgebühr Mahn- und Vollstreckungsbescheid" style="padding: 16px 20px; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Ihr Kunde, wenn er in Verzug ist</td></tr></tbody></table></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160"><span class="ph">[Stand und Berechnungsgrundlage (RVG, GKG) nach Freigabe durch Jan]</span></p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #F4F1EA; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Ein Risiko bleibt: Ist beim Kunden nichts zu holen, bleiben die Kosten bei Ihnen. Nach einem Widerspruch kommen weitere Gerichtskosten für das streitige Verfahren hinzu. Wir nennen Ihnen vor jedem Schritt die Kosten. Mehr auf der Seite <a href="../kosten/">Kosten</a>.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Dauer</p><h2 class="h2">Wie lange dauert ein Mahnverfahren?</h2></div><p class="lead" style="margin: 0">Ohne Widerspruch haben Sie den Vollstreckungsbescheid meist nach einigen Wochen. Mit Widerspruch dauert es so lange wie eine Klage.</p></div><div style="position: relative; margin: 30px 0 20px"><div class="tlbar" style="position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 4px; background: #FFFFFF" aria-hidden="true"></div><div class="g5 tlg" style="position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px"><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Erlass des Mahnbescheids nach Antrag</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3"><span class="ph">[Erfahrungswert]</span></p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Widerspruchsfrist</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">2 Wochen ab Zustellung (§ 692 Abs. 1 Nr. 3 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Antrag auf Vollstreckungsbescheid</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">spätestens 6 Monate nach Zustellung (§ 701 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #FFFFFF; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Einspruchsfrist gegen den Vollstreckungsbescheid</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">2 Wochen ab Zustellung (§§ 339, 700 ZPO)</p></div><div><span style="display: block; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #B8945A; background: #B8945A; box-sizing: border-box"></span><p style="margin: 18px 0 6px; font-size: 14px; line-height: 1.5; color: #4A5160">Klage nach Widerspruch</p><p class="serif" style="margin: 0; font-size: 21px; line-height: 1.3">mehrere Monate, je nach Gericht</p></div></div></div></div></section><section style="padding: 0 0 88px; background: #FFFFFF"><div class="wrap" style="padding-top: 72px"><img src="../assets/img/justizgebaeude.jpg" alt="Treppenhalle eines historischen Justizgebäudes" style="display: block; width: 100%; height: 340px; object-fit: cover; object-position: 50% 60%; border-radius: 14px"></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap side"><div><p class="eb">Sonderfälle</p><h2 class="h2">Kunde insolvent oder in Österreich?</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Wird über das Vermögen Ihres Kunden das Insolvenzverfahren eröffnet, wird das Mahnverfahren unterbrochen (§ 240 ZPO). Wir melden Ihre Forderung dann beim Insolvenzverwalter an.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Sitzt Ihr Kunde in Österreich, ist ein deutsches Mahnverfahren oft möglich, wenn ein deutsches Gericht zuständig ist. Häufig passt auch der Europäische Zahlungsbefehl. Den Weg und die Exekution in Österreich erklären wir auf der Seite <a href="../inkasso-oesterreich/">Inkasso Österreich</a>.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Praxis</p><h2 class="h2">Beispiel aus der Praxis: Werklohn, Kunde schweigt</h2></div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Konstruiertes Beispiel, kein Mandatsfall.</p><div class="g2" style="gap: 20px; margin: 10px 0 18px"><article style="padding: 30px; border-radius: 10px; background: #F4F1EA; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; color: #8B6A2E">Beispiel</span><h3 class="serif" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400">Messebauer aus Berlin, 4.200 € offen</h3><p style="margin: 0; font-size: 15px; line-height: 1.7; color: #333D4F">Ein Messebauer aus Berlin wartet seit drei Monaten auf 4.200 € von einem Aussteller in Hamburg. Der Kunde hat die Abnahme bestätigt, reagiert aber nicht. Wir beantragen den Mahnbescheid beim Amtsgericht Wedding. Ohne Widerspruch folgen Vollstreckungsbescheid und Kontopfändung.</p></article></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Mahnverfahren</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Vollstreckungsbescheid: was Gläubiger danach tun</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#" style="display: flex; flex-direction: column; ga
