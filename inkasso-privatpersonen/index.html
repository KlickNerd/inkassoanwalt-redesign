<section style="background: #F4F1EA; color: #1B2A4A; padding: 28px 0 64px"><div class="wrap"><nav aria-label="Brotkrumen" style="font-size: 13px; color: #5A6172; margin-bottom: 32px"><a href="../" style="color: #5A6172">Startseite</a> / <a href="../leistungen/" style="color: #5A6172">Leistungen</a> / <span>Inkasso für Privatpersonen</span></nav><div class="hero" style="grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); align-items: center"><div><p class="eb" style="">Inkasso für Privatpersonen</p><h1 class="serif h1" style="margin: 0; font-size: 48px; line-height: 1.08; font-weight: 400">Inkasso für Privatpersonen: <span style="display: block; font-size: 0.6em; line-height: 1.3; margin-top: 12px">wenn Ihnen jemand Geld schuldet</span></h1><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F"><span class="ph">[Offene Entscheidung 2: Vertritt die Kanzlei Privatpersonen? Gibt es eine Mindestforderung? Die Seite wird erst nach dieser Entscheidung veröffentlicht.]</span></p><p style="margin: 22px 0 0; font-size: 18px; line-height: 1.7; color: #333D4F">Sie haben jemandem Geld geliehen, ein Auto verkauft oder eine Wohnung vermietet, und das Geld kommt nicht? Wir prüfen ehrlich, ob Sie Ihre Forderung beweisen können und was es kostet. Dann fordern wir Ihr Geld zurück, notfalls mit Gericht und Gerichtsvollzieher.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #1B2A4A; color: #FFFFFF">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid #1B2A4A; color: #1B2A4A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> +49 (0)30 62 93 06 66</a></div><p style="margin: 12px 0 0; font-size: 14px; color: #5A6172">Sie erhalten eine Einschätzung zu Beweislage, Weg und Kosten.</p><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 22px; border-top: 1px solid #DDD6C8; font-size: 15px"><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Rechtsanwalt seit 2008, Rechtsanwaltskammer Berlin</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span>Bundesweit, Unterlagen und Abstimmung digital</span></div><div style="display: flex; gap: 12px; align-items: center"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span><span class="ph">[Bewertungszahl und Quelle nach Freigabe]</span></span></div></div></div><div style="position: relative"><img src="../assets/img/jan-wasserfall-profil.jpg" alt="Rechtsanwalt Jan Waßerfall" style="display: block; width: 100%; height: 520px; object-fit: cover; object-position: 45% 30%; border-radius: 14px"><div style="position: absolute; left: 20px; bottom: 20px; background: #FFFFFF; color: #1B2A4A; padding: 14px 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(27,42,74,0.16)"><div class="serif" style="font-size: 18px">Jan Waßerfall</div><div style="font-size: 13px; color: #5A6172; margin-top: 2px">Rechtsanwalt · Kanzlei Waßerfall</div></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Ausgangslage</p><h2 class="h2">Inkasso für Privatpersonen: typische Fälle</h2></div><p class="lead" style="margin: 0">Diese Seite ist für Privatleute, denen eine andere Person Geld schuldet.</p></div><ul style="list-style: none; margin: 6px 0 18px; padding: 0; display: flex; flex-direction: column; gap: 10px"><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Sie haben einem Freund oder Verwandten Geld geliehen, er zahlt nicht zurück.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Sie haben privat ein Auto oder Möbel verkauft, der Käufer zahlt den Rest nicht.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Ihr Mieter schuldet Miete. Dazu mehr auf der Seite <a href="../inkasso-vermieter/">Inkasso für Vermieter</a>.</span></li><li style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 10px; background: #F4F1EA; font-size: 16px; line-height: 1.6"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><span style="padding-top: 2px">Sie haben nebenbei eine Arbeit erledigt, der Auftraggeber zahlt nicht.</span></li></ul></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Beweislage</p><h2 class="h2">Geliehenes Geld zurückfordern: was Sie beweisen müssen</h2></div><p class="lead" style="margin: 0">Wer Geld verlangt, muss die Forderung beweisen. Bei Privatleuten fehlt oft ein schriftlicher Vertrag, deshalb prüfen wir die Beweislage zuerst.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27,42,74,0.05), 0 10px 30px rgba(27,42,74,0.07)"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Fall</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Was Sie beweisen müssen</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Gute Belege</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Fall" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Privatdarlehen</td><td data-label="Was Sie beweisen müssen" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Dass Sie das Geld gegeben haben und dass es zurückgezahlt werden sollte, also kein Geschenk war</td><td data-label="Gute Belege" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Schuldschein, Überweisung mit Verwendungszweck, Nachrichten, Zeugen</td></tr><tr style="vertical-align: top"><td data-label="Fall" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Privatverkauf</td><td data-label="Was Sie beweisen müssen" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Kaufvertrag, Preis und Übergabe</td><td data-label="Gute Belege" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Kaufvertrag, Quittung, Nachrichten</td></tr><tr style="vertical-align: top"><td data-label="Fall" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Arbeit für andere</td><td data-label="Was Sie beweisen müssen" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Auftrag, Leistung und vereinbarter Preis</td><td data-label="Gute Belege" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Nachrichten, Fotos, Rechnung</td></tr></tbody></table></div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Bargeld ohne Quittung ist schwer zu beweisen. Hat der Schuldner die Schuld schriftlich oder per Nachricht zugegeben, hilft das sehr. Mehr dazu: <a href="../ratgeber/schuldanerkenntnis/">Schuldanerkenntnis</a>.</p><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #FFFFFF; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #F4F1EA; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Wurde für ein Darlehen kein Rückzahlungstermin vereinbart, müssen Sie es erst kündigen. Die Frist beträgt drei Monate (§ 488 Abs. 3 BGB). Erst danach ist das Geld fällig.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Leistungen</p><h2 class="h2">Was wir für Sie übernehmen</h2></div><p class="lead" style="margin: 0">Wir übernehmen den ganzen Weg, von der Prüfung bis zur Pfändung.</p></div><div class="g2" style="gap: 16px; margin: 8px 0 18px"><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Prüfung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">von Beweislage, Fälligkeit und Verjährung, dazu ob beim Schuldner etwas zu holen ist.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Anwaltsschreiben</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">mit Frist; zahlt der Schuldner, ist die Sache erledigt.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Mahnbescheid oder Klage</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">wenn er nicht zahlt oder bestreitet.</p></div></div><div style="display: flex; gap: 16px; padding: 24px; border-radius: 10px; background: #F4F1EA"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6A2E" stroke-width="2.2" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span><div><div class="serif" style="font-size: 20px; line-height: 1.3">Zwangsvollstreckung</div><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: #333D4F">mit dem Titel, etwa Konto- oder Lohnpfändung.</p></div></div></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ablauf</p><h2 class="h2">Ablauf in 5 Schritten</h2></div><div style="position: relative; margin: 24px 0 20px"><div style="position: absolute; left: 22px; right: 22px; top: 21px; height: 2px; border-radius: 2px; background: #E6E1D6" aria-hidden="true"></div><ol style="list-style: none; margin: 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px" class="g5"><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">1</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Anfrage</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Sie laden Belege und Nachrichten im Formular hoch.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">2</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Ersteinschätzung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Wir sagen Ihnen, wie gut die Beweislage ist und was es kostet. <span class="ph">[Reaktionszeit]</span></p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">3</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Auftrag</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Sie entscheiden. Erst dann entstehen Gebühren.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">4</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Durchsetzung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Schreiben, Mahnbescheid, Klage, Vollstreckung.</p></li><li><span class="serif" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #1B2A4A; color: #FFFFFF; font-size: 18px">5</span><h3 class="serif" style="margin: 16px 0 6px; font-size: 20px; font-weight: 400">Auszahlung</h3><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333D4F">Zahlungen des Schuldners leiten wir an Sie weiter.</p></li></ol></div><div style="margin: 28px 0 6px; border-radius: 14px; background: #1B2A4A; color: #FFFFFF; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px"><div class="serif" style="font-size: 26px; line-height: 1.25">Forderung prüfen lassen</div><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.65; color: #D2D7E1">Ihre Forderung jetzt einreichen.** Sie brauchen: Belege der Zahlung oder des Vertrags, Nachrichten, Mahnungen und die Anschrift des Schuldners.</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><a class="btn" href="../inkasso-online-beauftragen/" style="background: #FFFFFF; color: #1B2A4A">Forderung prüfen lassen <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn" href="tel:+493062930666" style="border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> Anrufen</a></div></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap"><div class="g2" style="align-items: end; margin-bottom: 28px"><div><p class="eb">Kosten</p><h2 class="h2">Kosten: wer zahlt den Anwalt?</h2></div><p class="lead" style="margin: 0">Die Anwaltskosten muss der Schuldner nur ersetzen, wenn er schon in Verzug war, als Sie uns beauftragt haben (§§ 280, 286 BGB). Mahnen Sie deshalb vorher selbst mit einer festen Frist.</p></div><div class="rt" style="margin: 14px 0 20px; overflow-x: auto; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E1D6"><table style="width: 100%; min-width: 540px; border-collapse: collapse; font-size: 15px"><thead><tr style="text-align: left"><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E; background: #FAF8F3">Posten</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Betrag</th><th style="padding: 16px 20px; border-bottom: 1px solid #E6E1D6; font-weight: 600; font-size: 13px; color: #8B6A2E">Wer trägt es am Ende?</th></tr></thead><tbody><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Ersteinschätzung</td><td data-label="Betrag" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[kostenlos oder Pauschale]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Sie</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Anwaltsschreiben</td><td data-label="Betrag" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€ nach RVG]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Der Schuldner, wenn er vorher in Verzug war, sonst Sie</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Gerichtskosten Mahnverfahren oder Klage</td><td data-label="Betrag" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6"><span class="ph">[€]</span></td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; border-bottom: 1px solid #ECE7DC; color: #333D4F; line-height: 1.6">Zunächst Sie, bei Erfolg der Schuldner</td></tr><tr style="vertical-align: top"><td data-label="Posten" style="padding: 16px 20px; font-weight: 600; color: #1B2A4A; background: #FAF8F3; line-height: 1.6">Verlorener Prozess</td><td data-label="Betrag" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Kosten beider Seiten</td><td data-label="Wer trägt es am Ende?" style="padding: 16px 20px; color: #333D4F; line-height: 1.6">Sie (§ 91 ZPO)</td></tr></tbody></table></div><div style="margin: 18px 0; padding: 20px 24px; border-radius: 10px; background: #F4F1EA; font-size: 15px; line-height: 1.7; color: #333D4F; display: flex; gap: 14px"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 15px Georgia,serif; color: #8B6A2E">i</span><span>Ist beim Schuldner nichts zu holen, bleiben die Kosten bei Ihnen, auch wenn Sie gewinnen. Prüfen Sie, ob eine Rechtsschutzversicherung den Fall abdeckt. Ab Verzug stehen Ihnen Zinsen von 5 Prozentpunkten über dem Basiszinssatz zu (§ 288 Abs. 1 BGB). Mehr: <a href="../kosten/">Kosten</a>.</span></div></div></section><section class="sec" style="padding: 96px 0; background: #1B2A4A; color: #FFFFFF"><div class="wrap side"><div><p class="eb" style="color: #E0B252">Fristen</p><h2 class="h2" style="color: #FFFFFF">Dauer, Verjährung und Insolvenz des Schuldners</h2></div><div><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Zahlt der Schuldner auf das Anwaltsschreiben, ist die Sache oft in wenigen Wochen erledigt. Mit Gericht und Vollstreckung dauert es mehrere Monate.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #D2D7E1">Forderungen verjähren in drei Jahren, gerechnet ab dem Ende des Jahres, in dem sie fällig wurden (§§ 195, 199 BGB). Eine Mahnung hält das nicht auf, ein Mahnbescheid schon (§ 204 BGB). Ist der Schuldner insolvent, melden wir Ihre Forderung beim Insolvenzverwalter an. Einzeln vollstrecken dürfen Sie dann nicht mehr (§ 89 InsO).</p></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF"><div class="wrap side"><div><p class="eb">Praxis</p><h2 class="h2">Beispiel: Privatdarlehen an einen Bekannten, 3.000 €</h2></div><div><p style="margin: 10px 0 14px; font-size: 14px; font-style: italic; color: #4A5160">Konstruiertes Beispiel, kein Mandatsfall.</p><p style="margin: 0 0 14px; font-size: 16px; line-height: 1.75; color: #333D4F">Eine Frau leiht einem Bekannten 3.000 € per Überweisung mit dem Verwendungszweck „Darlehen bis Ende Juni“. Er zahlt nicht und schreibt: „Ich zahle, sobald ich kann.“ Damit sind Darlehen und Fälligkeit belegt. Sie mahnt ihn selbst mit Frist, danach beauftragt sie uns. Auf den Mahnbescheid widerspricht er nicht, wir beantragen die Kontopfändung.</p></div></div></section><section class="sec" style="padding: 96px 0; background: #F4F1EA"><div class="wrap"><div style="max-width: 760px; margin-bottom: 24px"><p class="eb">Ratgeber</p><h2 class="h2">Mehr zum Thema</h2></div><div class="g3" style="margin: 8px 0 14px"><a class="card" href="../ratgeber/mahnung-muster/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Mahnung Muster</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/schuldanerkenntnis/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Schuldanerkenntnis: warum es Ihre Forderung sichert</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../ratgeber/klagen-oder-nicht/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Klagen oder nicht? Das Prozesskostenrisiko</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../wann-verjaehren-rechnungen-forderungen/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Wann verjähren Rechnungen und Forderungen?</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../inkasso-vermieter/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Inkasso für Vermieter</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="../mahnverfahren-anwalt/" style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 10px; background: #FFFFFF; text-decoration: none; min-height: 110px; box-sizing: border-box"><span class="serif" style="font-size: 19px; line-height: 1.3; color: #1B2A4A">Gerichtliches Mahnverfahren</span><span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8B6A2E">Weiterlesen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div></section><section class="sec" style="padding: 96px 0; background: #FFFFFF">
